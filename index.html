<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI X</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        omni: {
                            black: '#050508',
                            card: '#0f1016',
                            border: 'rgba(16, 185, 129, 0.2)',
                            neon: '#00ff87',
                            green: '#10b981'
                        }
                    },
                    boxShadow: {
                        'neon': '0 0 15px rgba(0, 255, 135, 0.3)',
                        'neon-lg': '0 0 25px rgba(16, 185, 129, 0.4)'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #050508;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .story-ring {
            background: linear-gradient(135deg, #10b981, #00ff87, #3b82f6);
            padding: 2px;
        }
        .glass-panel {
            background: rgba(15, 16, 22, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .x-gradient-text {
            background: linear-gradient(135deg, #00ff87, #10b981, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-[#050508] text-white h-full min-h-screen pb-24">

    <!-- SIGNUP / LOGIN SCREEN -->
    <div id="signup-screen" class="fixed inset-0 z-50 bg-[#050508] flex items-center justify-center p-4 max-w-md mx-auto">
        <div class="w-full bg-[#0f1016] border border-emerald-500/30 rounded-3xl p-6 space-y-6 shadow-neon-lg">
            <div class="text-center space-y-1">
                <h1 class="text-3xl font-black tracking-widest x-gradient-text">OMNI X</h1>
                <p class="text-xs text-zinc-400">Yeni Nesil Sosyal Deneyim</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">İsim Soyisim</label>
                    <input type="text" id="signup-fullname" placeholder="Örn: Ahmet Yılmaz" class="w-full bg-[#050508] border border-zinc-800 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">E-posta Adresi</label>
                    <input type="email" id="signup-email" placeholder="ornek@gmail.com" class="w-full bg-[#050508] border border-zinc-800 rounded-xl px-3.5 py-3 text-xs text-white focus:outline-none focus:border-emerald-500 transition">
                </div>
                <button onclick="directRegisterOrLogin()" class="w-full bg-gradient-to-r from-emerald-400 to-green-500 text-black font-black py-3.5 rounded-xl text-xs shadow-neon active:scale-95 transition">GİRİŞ YAP / KAYIT OL</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="hidden">
        <!-- TOP HEADER -->
        <header class="sticky top-0 z-40 glass-panel border-b border-zinc-900/80 px-4 py-3 flex items-center justify-between max-w-md mx-auto">
            <span class="font-black text-2xl tracking-wider x-gradient-text">OMNI X</span>
            <div class="flex items-center gap-4">
                <button onclick="openModal('inbox-modal')" class="relative text-lg text-zinc-300 hover:text-emerald-400 transition">
                    <i class="far fa-bell"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-emerald-400 rounded-full"></span>
                </button>
                <button onclick="openModal('dm-modal')" class="text-lg text-zinc-300 hover:text-emerald-400 transition">
                    <i class="far fa-paper-plane"></i>
                </button>
                <button onclick="openModal('settings-modal')" class="text-lg text-zinc-300 hover:text-emerald-400 transition">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <!-- APP CONTAINER -->
        <div class="max-w-md mx-auto relative">
            <section id="tab-feed">
                <!-- STORIES BAR -->
                <div class="py-3 px-3 border-b border-zinc-900/60 overflow-x-auto hide-scrollbar flex gap-4 items-center bg-[#050508]">
                    <div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="openModal('create-story-modal')">
                        <div class="relative w-15 h-15 rounded-full p-0.5 border-2 border-dashed border-emerald-500/60 flex items-center justify-center">
                            <img id="my-story-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-full h-full object-cover rounded-full">
                            <div class="absolute bottom-0 right-0 bg-emerald-400 text-black w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold border border-black">
                                <i class="fas fa-plus"></i>
                            </div>
                        </div>
                        <span class="text-[10px] text-zinc-400 font-medium">Hikayen</span>
                    </div>
                    <div id="stories-container" class="flex gap-4"></div>
                </div>

                <!-- FEED POSTS -->
                <div id="posts-container" class="space-y-4 pt-2"></div>
            </section>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="fixed bottom-0 left-0 right-0 z-40 glass-panel border-t border-zinc-900/80 max-w-md mx-auto px-6 py-3 flex justify-around items-center">
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="text-emerald-400 text-xl"><i class="fas fa-home"></i></button>
            <button onclick="openModal('search-modal')" class="text-zinc-500 hover:text-emerald-400 text-xl transition"><i class="fas fa-search"></i></button>
            <button onclick="openModal('create-post-modal')" class="w-11 h-11 rounded-full bg-gradient-to-r from-emerald-400 to-green-500 text-black flex items-center justify-center font-bold text-lg shadow-neon active:scale-90 transition"><i class="fas fa-plus"></i></button>
            <button onclick="openModal('dm-modal')" class="text-zinc-500 hover:text-emerald-400 text-xl transition"><i class="far fa-paper-plane"></i></button>
            <button onclick="openModal('settings-modal')" class="text-zinc-500 hover:text-emerald-400 text-xl transition"><i class="fas fa-cog"></i></button>
        </nav>
    </div>

    <!-- MODALS -->

    <!-- GELEN KUTUSU MODAL -->
    <div id="inbox-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#0f1016] border border-emerald-500/30 w-full max-w-sm rounded-3xl p-4 space-y-4 shadow-neon-lg flex flex-col h-[70vh]">
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2">
                <h3 class="font-bold text-xs tracking-wider uppercase text-emerald-400"><i class="far fa-bell mr-1.5"></i> Gelen Kutusu</h3>
                <button onclick="closeModal('inbox-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div id="inbox-list" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
        </div>
    </div>

    <!-- ARAMA MODAL -->
    <div id="search-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#0f1016] border border-emerald-500/30 w-full max-w-sm rounded-3xl p-4 space-y-4 shadow-neon-lg flex flex-col h-[70vh]">
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2">
                <h3 class="font-bold text-xs tracking-wider uppercase text-emerald-400"><i class="fas fa-search mr-1.5"></i> Keşfet & Arama</h3>
                <button onclick="closeModal('search-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <input type="text" id="video-search-input" oninput="searchVideosAndPosts(this.value)" placeholder="Video başlığı veya kullanıcı ara..." class="w-full bg-[#050508] border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
            <div id="search-results" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <p class="text-center text-xs text-zinc-500 py-8">Kullanıcı veya video başlığı yazın...</p>
            </div>
        </div>
    </div>

    <!-- DM MESAJLAR MODAL -->
    <div id="dm-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#0f1016] border border-emerald-500/30 w-full max-w-sm rounded-3xl p-4 space-y-4 shadow-neon-lg flex flex-col h-[75vh]">
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2">
                <h3 class="font-bold text-xs tracking-wider uppercase text-emerald-400"><i class="far fa-paper-plane mr-1.5"></i> Direkt Mesajlar</h3>
                <button onclick="closeModal('dm-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div id="chat-list" class="flex-1 overflow-y-auto space-y-2"></div>
            <div id="chat-active-view" class="hidden flex-1 flex flex-col space-y-2 border-t border-zinc-800/80 pt-2">
                <div class="flex justify-between items-center border-b border-zinc-800/60 pb-1.5">
                    <span id="chat-target-name" class="text-xs font-bold text-emerald-400">Sohbet</span>
                    <button onclick="closeActiveChat()" class="text-[10px] text-zinc-400 hover:text-white">Geri</button>
                </div>
                <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
                <div class="flex gap-2 pt-1">
                    <input type="text" id="chat-input" placeholder="Mesaj gönder..." class="flex-1 bg-[#050508] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                    <button onclick="sendMessage()" class="bg-emerald-400 text-black px-3.5 py-2 rounded-xl text-xs font-bold shadow-neon"><i class="fas fa-arrow-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- YORUMLAR MODAL (EKRANIN ALT YARISI) -->
    <div id="comments-modal" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-end">
        <div class="bg-[#0f1016] border-t border-emerald-500/30 w-full max-w-md mx-auto rounded-t-3xl p-4 space-y-3 shadow-neon-lg flex flex-col h-[50vh]">
            <div class="w-10 h-1 bg-zinc-700/80 rounded-full mx-auto mb-1"></div>
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400"><i class="far fa-comment mr-1"></i> Yorumlar</h3>
                <button onclick="closeModal('comments-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div id="comments-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            <div id="replying-to-bar" class="hidden flex justify-between items-center bg-[#050508] px-3 py-1.5 rounded-lg text-[11px] text-emerald-400 border border-emerald-500/30">
                <span id="replying-to-text"></span>
                <button onclick="cancelReply()" class="text-zinc-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex gap-2 pt-1 border-t border-zinc-800/80">
                <input type="text" id="comment-input" placeholder="Yorum ekle..." class="flex-1 bg-[#050508] border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                <button onclick="addCommentToPost()" class="bg-emerald-400 text-black px-4 py-2 rounded-xl text-xs font-bold shadow-neon">Gönder</button>
            </div>
        </div>
    </div>

    <!-- CREATE POST MODAL -->
    <div id="create-post-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#0f1016] border border-emerald-500/30 w-full max-w-sm rounded-3xl p-4 space-y-4 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400">Yeni Paylaşım</h3>
                <button onclick="closeModal('create-post-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-3">
                <input type="file" id="post-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/20 file:text-emerald-400 cursor-pointer">
                <textarea id="post-caption-input" rows="3" placeholder="Açıklama veya düşünceni yaz..." class="w-full bg-[#050508] border border-zinc-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
                <div id="post-media-preview" class="hidden relative rounded-xl overflow-hidden max-h-36 bg-black flex items-center justify-center"></div>
                <button onclick="toggleGifSearch()" class="w-full bg-[#050508] border border-zinc-800 text-emerald-400 py-2 rounded-xl text-xs font-semibold hover:border-emerald-500/40 transition flex items-center justify-center gap-2">
                    <i class="fas fa-gift"></i> GIF Arayıp Ekle (Tenor)
                </button>
            </div>
            <button onclick="submitNewPost()" class="w-full bg-emerald-400 text-black font-black py-3 rounded-xl text-xs shadow-neon">Paylaş</button>
        </div>
    </div>

    <!-- GIF PICKER MODAL -->
    <div id="gif-picker-modal" class="hidden fixed inset-0 z-[60] bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#0f1016] border border-emerald-500/30 w-full max-w-sm rounded-3xl p-4 space-y-3 shadow-neon-lg flex flex-col h-[65vh]">
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400">GIF Arama</h3>
                <button onclick="closeModal('gif-picker-modal')" class="text-zinc-400"><i class="fas fa-times"></i></button>
            </div>
            <input type="text" id="gif-search-box" placeholder="GIF ara..." oninput="searchGifs(this.value)" class="w-full bg-[#050508] border border-zinc-800 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            <div id="gif-results-grid" class="grid grid-cols-2 gap-2 overflow-y-auto max-h-60 pr-1">
                <p class="col-span-2 text-center text-xs text-zinc-500 py-8">Arama yapmak için kelime yazın...</p>
            </div>
        </div>
    </div>

    <!-- CREATE STORY MODAL -->
    <div id="create-story-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#0f1016] border border-emerald-500/30 w-full max-w-sm rounded-3xl p-4 space-y-4 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400">Hikaye Ekle</h3>
                <button onclick="closeModal('create-story-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <input type="file" id="story-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/20 file:text-emerald-400 cursor-pointer">
            <button onclick="submitNewStory()" class="w-full bg-emerald-400 text-black font-black py-3 rounded-xl text-xs shadow-neon">Hikayelere Ekle</button>
        </div>
    </div>

    <!-- VIEW STORY MODAL -->
    <div id="view-story-modal" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between p-4 max-w-md mx-auto">
        <div class="flex items-center justify-between py-2 border-b border-zinc-800">
            <div class="flex items-center gap-2">
                <img id="story-user-avatar" src="" class="w-8 h-8 rounded-full border border-emerald-400 object-cover">
                <span id="story-user-name" class="font-bold text-xs text-white"></span>
            </div>
            <button onclick="closeStoryView()" class="text-white text-base"><i class="fas fa-times"></i></button>
        </div>
        <div id="story-media-container" class="flex-1 flex items-center justify-center my-2 overflow-hidden"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-[#0f1016] border border-emerald-500/30 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400"><i class="fas fa-cog mr-1"></i> Ayarlar</h3>
                <button onclick="closeModal('settings-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-2 text-xs">
                <button onclick="clearAllData()" class="w-full text-left p-3 rounded-xl bg-[#050508] border border-zinc-800 text-amber-400 hover:border-amber-500/40 transition">Önbelleği Temizle</button>
                <button onclick="logoutAccount()" class="w-full text-left p-3 rounded-xl bg-[#050508] border border-zinc-800 text-emerald-400 hover:border-emerald-500/40 transition">Çıkış Yap</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        var state = {
            currentUser: null,
            followingUsers: [],
            notifications: [
                { id: 1, type: "follow", user: "ebru.art", text: "seni takip etmeye başladı.", time: "10dk önce" },
                { id: 2, type: "like", user: "can_tech", text: "gönderini beğendi.", time: "1sa önce" }
            ],
            stories: [
                { id: 1, user: "can_tech", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150", url: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=500", isVideo: false },
                { id: 2, user: "ebru.art", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150", url: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500", isVideo: false }
            ],
            posts: [
                {
                    id: 101,
                    user: "Can_Tech",
                    avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150",
                    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                    isVideo: true,
                    caption: "OMNI X dünyasında harika bir doğa videosu! 🏔️✨",
                    likes: 24,
                    liked: false,
                    comments: [{ id: 1, user: "ebru.art", text: "Muhteşem bir paylaşım!", replies: [{ user: "Can_Tech", text: "Teşekkürler!" }] }]
                }
            ],
            chats: {
                "can_tech": [
                    { sender: "can_tech", text: "OMNI X'e hoş geldin!" }
                ]
            },
            activeChatUser: null,
            activeCommentPostId: null,
            replyingToCommentUser: null,
            selectedMediaUrl: null
        };

        window.onload = function() {
            loadSavedDatabase();
            if (!state.currentUser) {
                document.getElementById('signup-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            } else {
                document.getElementById('signup-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initMainApp();
            }
        };

        function loadSavedDatabase() {
            try {
                var savedUser = localStorage.getItem('omnix_active_user');
                if (savedUser) { state.currentUser = JSON.parse(savedUser); }
                var savedPosts = localStorage.getItem('omnix_posts_data');
                if (savedPosts) { state.posts = JSON.parse(savedPosts); }
                var savedFollowing = localStorage.getItem('omnix_following_users');
                if (savedFollowing) { state.followingUsers = JSON.parse(savedFollowing); }
            } catch(e){}
        }

        function directRegisterOrLogin() {
            var fullname = document.getElementById('signup-fullname').value.trim();
            var email = document.getElementById('signup-email').value.trim().toLowerCase();
            if (!email) { alert("Lütfen e-posta giriniz!"); return; }

            state.currentUser = {
                username: email.split('@')[0],
                name: fullname || email.split('@')[0],
                email: email,
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
            };
            localStorage.setItem('omnix_active_user', JSON.stringify(state.currentUser));
            document.getElementById('signup-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            initMainApp();
        }

        function initMainApp() {
            if (state.currentUser) {
                document.getElementById('my-story-avatar').src = state.currentUser.avatar;
            }
            renderStories();
            renderPosts();
            renderChatList();
            renderInbox();
        }

        function renderInbox() {
            var list = document.getElementById('inbox-list');
            list.innerHTML = state.notifications.map(function(n) {
                var icon = n.type === 'follow' ? '<i class="fas fa-user-plus"></i>' : '<i class="fas fa-heart"></i>';
                return '<div class="flex items-center justify-between p-3 rounded-2xl bg-[#050508] border border-zinc-800/80">' +
                    '<div class="flex items-center gap-3">' +
                        '<div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">' + icon + '</div>' +
                        '<div>' +
                            '<p class="text-xs text-white"><span class="font-bold text-emerald-400">' + n.user + '</span> ' + n.text + '</p>' +
                            '<span class="text-[10px] text-zinc-500">' + n.time + '</span>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderStories() {
            var container = document.getElementById('stories-container');
            container.innerHTML = state.stories.map(function(s) {
                return '<div onclick="openStoryView(\'' + s.user + '\', \'' + s.avatar + '\', \'' + s.url + '\', ' + s.isVideo + ')" class="flex flex-col items-center gap-1 shrink-0 cursor-pointer">' +
                    '<div class="story-ring w-14 h-14 rounded-full flex items-center justify-center">' +
                        '<img src="' + s.avatar + '" class="w-full h-full object-cover rounded-full border-2 border-black">' +
                    '</div>' +
                    '<span class="text-[10px] text-zinc-300 truncate w-14 text-center">' + s.user + '</span>' +
                '</div>';
            }).join('');
        }

        function renderPosts() {
            var container = document.getElementById('posts-container');
            container.innerHTML = state.posts.map(function(p) {
                var isFollowing = state.followingUsers.includes(p.user);
                var followBtn = (p.user !== state.currentUser.username) ? 
                    '<button onclick="toggleFollow(\'' + p.user + '\')" class="text-[11px] px-3 py-1 rounded-full font-bold transition ' + (isFollowing ? 'bg-zinc-800 text-zinc-400' : 'bg-emerald-400 text-black shadow-neon') + '">' +
                        (isFollowing ? 'Takiptesin' : 'Takip Et') +
                    '</button>' : '';

                var media = p.isVideo ? 
                    '<video src="' + p.url + '" muted playsinline preload="auto" class="w-full max-h-[420px] object-cover"></video>' : 
                    '<img src="' + p.url + '" class="w-full max-h-[420px] object-cover">';

                return '<article class="post-item bg-[#050508] border-b border-zinc-900/80 pb-4">' +
                    '<div class="flex items-center justify-between p-3">' +
                        '<div class="flex items-center gap-2.5">' +
                            '<div class="story-ring w-8 h-8 rounded-full flex items-center justify-center">' +
                                '<img src="' + p.avatar + '" class="w-full h-full object-cover rounded-full border border-black">' +
                            '</div>' +
                            '<span class="font-bold text-xs text-white">' + p.user + '</span>' +
                        '</div>' + followBtn +
                    '</div>' +
                    '<div class="relative overflow-hidden bg-black flex items-center justify-center max-h-[420px]">' + media + '</div>' +
                    '<div class="p-3 space-y-2">' +
                        '<div class="flex justify-between items-center text-lg">' +
                            '<div class="flex gap-4">' +
                                '<button onclick="toggleLike(' + p.id + ')" class="' + (p.liked ? 'text-emerald-400' : 'text-zinc-400') + ' transition"><i class="' + (p.liked ? 'fas' : 'far') + ' fa-heart"></i></button>' +
                                '<button onclick="openCommentsModal(' + p.id + ')" class="text-zinc-400 hover:text-emerald-400 transition"><i class="far fa-comment"></i></button>' +
                                '<button onclick="openChatWith(\'' + p.user + '\')" class="text-zinc-400 hover:text-emerald-400 transition"><i class="far fa-paper-plane"></i></button>' +
                            '</div>' +
                        '</div>' +
                        '<p class="font-bold text-xs text-emerald-400">' + (p.likes || 0) + ' beğenme</p>' +
                        '<p class="text-xs text-zinc-200"><span class="font-bold mr-1 text-white">' + p.user + '</span>' + p.caption + '</p>' +
                    '</div>' +
                '</article>';
            }).join('');

            setupVideoIntersectionObserver();
        }

        function toggleFollow(username) {
            if (state.followingUsers.includes(username)) {
                state.followingUsers = state.followingUsers.filter(function(u){ return u !== username; });
            } else {
                state.followingUsers.push(username);
            }
            localStorage.setItem('omnix_following_users', JSON.stringify(state.followingUsers));
            renderPosts();
        }

        function searchVideosAndPosts(query) {
            var resultsContainer = document.getElementById('search-results');
            if (!query.trim()) {
                resultsContainer.innerHTML = '<p class="text-center text-xs text-zinc-500 py-8">Kullanıcı veya video başlığı yazın...</p>';
                return;
            }

            var filtered = state.posts.filter(function(p){ 
                return p.caption.toLowerCase().includes(query.toLowerCase()) || p.user.toLowerCase().includes(query.toLowerCase()); 
            });

            if (filtered.length === 0) {
                resultsContainer.innerHTML = '<p class="text-center text-xs text-zinc-500 py-8">Sonuç bulunamadı.</p>';
                return;
            }

            resultsContainer.innerHTML = filtered.map(function(p){
                var media = p.isVideo ? '<video src="' + p.url + '" class="w-full h-full object-cover"></video>' : '<img src="' + p.url + '" class="w-full h-full object-cover">';
                return '<div class="flex items-center gap-3 p-2.5 rounded-2xl bg-[#050508] border border-zinc-800">' +
                    '<div class="w-11 h-11 rounded-xl bg-black overflow-hidden shrink-0 flex items-center justify-center">' + media + '</div>' +
                    '<div class="flex-1 truncate">' +
                        '<p class="font-bold text-xs text-white">' + p.user + '</p>' +
                        '<p class="text-[10px] text-zinc-400 truncate">' + p.caption + '</p>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderChatList() {
            var list = document.getElementById('chat-list');
            var users = Object.keys(state.chats);
            list.innerHTML = users.map(function(u){
                return '<div onclick="openChatWith(\'' + u + '\')" class="flex items-center justify-between p-3 rounded-2xl bg-[#050508] border border-zinc-800 cursor-pointer hover:border-emerald-500/40 transition">' +
                    '<div class="flex items-center gap-2.5">' +
                        '<div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">' + u[0].toUpperCase() + '</div>' +
                        '<span class="text-xs font-bold text-white">' + u + '</span>' +
                    '</div>' +
                    '<i class="fas fa-chevron-right text-xs text-zinc-600"></i>' +
                '</div>';
            }).join('');
        }

        function openChatWith(username) {
            state.activeChatUser = username;
            if (!state.chats[username]) state.chats[username] = [];
            document.getElementById('chat-target-name').innerText = '@' + username;
            document.getElementById('chat-list').classList.add('hidden');
            document.getElementById('chat-active-view').classList.remove('hidden');
            openModal('dm-modal');
            renderMessages();
        }

        function closeActiveChat() {
            state.activeChatUser = null;
            document.getElementById('chat-active-view').classList.add('hidden');
            document.getElementById('chat-list').classList.remove('hidden');
        }

        function renderMessages() {
            var container = document.getElementById('chat-messages');
            var msgs = state.chats[state.activeChatUser] || [];
            container.innerHTML = msgs.map(function(m){
                var isMe = m.sender === state.currentUser.username;
                return '<div class="flex flex-col ' + (isMe ? 'items-end' : 'items-start') + '">' +
                    '<div class="max-w-[80%] p-2.5 rounded-2xl text-xs ' + (isMe ? 'bg-emerald-400 text-black font-bold' : 'bg-[#050508] text-white border border-zinc-800') + '">' + m.text + '</div>' +
                '</div>';
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (!text || !state.activeChatUser) return;

            state.chats[state.activeChatUser].push({ sender: state.currentUser.username, text: text });
            input.value = '';
            renderMessages();
        }

        function openCommentsModal(postId) {
            state.activeCommentPostId = postId;
            renderComments();
            openModal('comments-modal');
        }

        function renderComments() {
            var post = state.posts.find(function(p){ return p.id === state.activeCommentPostId; });
            var list = document.getElementById('comments-list');
            if (!post || !post.comments || post.comments.length === 0) {
                list.innerHTML = '<p class="text-center text-xs text-zinc-500 py-6">Henüz yorum yapılmamış.</p>';
                return;
            }
            list.innerHTML = post.comments.map(function(c){
                var repliesHtml = (c.replies && c.replies.length > 0) ? 
                    '<div class="pl-3 border-l-2 border-emerald-500/40 space-y-1 mt-1.5">' +
                        c.replies.map(function(r){
                            return '<div class="text-[11px]"><span class="font-bold text-emerald-300">' + r.user + ':</span> <span class="text-zinc-300">' + r.text + '</span></div>';
                        }).join('') +
                    '</div>' : '';

                return '<div class="bg-[#050508] p-2.5 rounded-2xl text-xs border border-zinc-800 space-y-1">' +
                    '<div class="flex justify-between items-center">' +
                        '<span class="font-bold text-emerald-400">' + c.user + '</span>' +
                        '<button onclick="startReplyTo(\'' + c.user + '\')" class="text-[10px] text-zinc-500 hover:text-emerald-400 flex items-center gap-1"><i class="fas fa-reply"></i> Yanıtla</button>' +
                    '</div>' +
                    '<p class="text-zinc-200">' + c.text + '</p>' + repliesHtml +
                '</div>';
            }).join('');
        }

        function startReplyTo(user) {
            state.replyingToCommentUser = user;
            document.getElementById('replying-to-text').innerText = '@' + user + ' kullanıcısına yanıt veriyorsun';
            document.getElementById('replying-to-bar').classList.remove('hidden');
            document.getElementById('comment-input').focus();
        }

        function cancelReply() {
            state.replyingToCommentUser = null;
            document.getElementById('replying-to-bar').classList.add('hidden');
        }

        function addCommentToPost() {
            var input = document.getElementById('comment-input');
            var text = input.value.trim();
            if(!text || !state.activeCommentPostId) return;

            var post = state.posts.find(function(p){ return p.id === state.activeCommentPostId; });
            if(post) {
                if(!post.comments) post.comments = [];
                if (state.replyingToCommentUser) {
                    var targetComment = post.comments.find(function(c){ return c.user === state.replyingToCommentUser; });
                    if (targetComment) {
                        if (!targetComment.replies) targetComment.replies = [];
                        targetComment.replies.push({ user: state.currentUser.username, text: text });
                    }
                    cancelReply();
                } else {
                    post.comments.push({ id: Date.now(), user: state.currentUser.username, text: text, replies: [] });
                }
                savePostsState();
                input.value = '';
                renderComments();
                renderPosts();
            }
        }

        function setupVideoIntersectionObserver() {
            var observerOptions = { root: null, threshold: [0, 0.25, 0.75, 1.0] };
            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    var video = entry.target.querySelector('video');
                    if (!video) return;
                    if (entry.intersectionRatio >= 0.25) {
                        video.play().catch(function(){});
                        if (entry.intersectionRatio >= 0.75) { video.muted = false; } 
                        else { video.muted = true; }
                    } else {
                        video.pause();
                        video.muted = true;
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.post-item').forEach(function(item) {
                observer.observe(item);
            });
        }

        function toggleLike(postId) {
            var post = state.posts.find(function(p){ return p.id === postId; });
            if(post) {
                post.liked = !post.liked;
                post.likes = (post.likes || 0) + (post.liked ? 1 : -1);
                savePostsState();
                renderPosts();
            }
        }

        function savePostsState() {
            try { localStorage.setItem('omnix_posts_data', JSON.stringify(state.posts)); } catch(e){}
        }

        function toggleGifSearch() { openModal('gif-picker-modal'); }

        async function searchGifs(query) {
            var grid = document.getElementById('gif-results-grid');
            if (!query.trim()) {
                grid.innerHTML = '<p class="col-span-2 text-center text-xs text-zinc-500 py-8">Arama yapmak için kelime yazın...</p>';
                return;
            }
            try {
                var res = await fetch('https://g.tenor.com/v1/search?q=' + encodeURIComponent(query) + '&key=LIVDSRZULELA&limit=10');
                var data = await res.json();
                if (data && data.results) {
                    grid.innerHTML = data.results.map(function(g){
                        return '<div onclick="selectGif(\'' + g.media[0].gif.url + '\')" class="cursor-pointer rounded-2xl overflow-hidden border border-zinc-800 hover:border-emerald-500 bg-black h-28 flex items-center justify-center">' +
                            '<img src="' + g.media[0].gif.url + '" class="w-full h-full object-cover">' +
                        '</div>';
                    }).join('');
                }
            } catch(e) {
                grid.innerHTML = '<p class="col-span-2 text-center text-xs text-red-400 py-8">GIF araması başarısız.</p>';
            }
        }

        function selectGif(url) {
            state.selectedMediaUrl = url;
            var preview = document.getElementById('post-media-preview');
            preview.innerHTML = '<img src="' + url + '" class="w-full h-full object-cover rounded-xl">';
            preview.classList.remove('hidden');
            closeModal('gif-picker-modal');
        }

        function submitNewPost() {
            var fileInput = document.getElementById('post-file-input');
            var caption = document.getElementById('post-caption-input').value.trim();

            if (!state.selectedMediaUrl && (!fileInput.files || !fileInput.files[0]) && !caption) {
                alert("Lütfen medya, GIF veya yazı ekleyin!");
                return;
            }

            if (state.selectedMediaUrl) {
                createPostFinal(state.selectedMediaUrl, false, caption);
            } else if (fileInput.files && fileInput.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    createPostFinal(e.target.result, fileInput.files[0].type.startsWith('video'), caption);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                createPostFinal(null, false, caption);
            }
        }

        function createPostFinal(url, isVideo, caption) {
            state.posts.unshift({
                id: Date.now(),
                user: state.currentUser.username,
                avatar: state.currentUser.avatar,
                url: url,
                isVideo: isVideo,
                caption: caption || "",
                likes: 0,
                liked: false,
                comments: []
            });
            savePostsState();
            state.selectedMediaUrl = null;
            document.getElementById('post-media-preview').classList.add('hidden');
            document.getElementById('post-caption-input').value = '';
            document.getElementById('post-file-input').value = '';
            closeModal('create-post-modal');
            renderPosts();
        }

        function submitNewStory() {
            var fileInput = document.getElementById('story-file-input');
            if (!fileInput.files || !fileInput.files[0]) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                state.stories.unshift({ id: Date.now(), user: state.currentUser.username, avatar: state.currentUser.avatar, url: e.target.result, isVideo: fileInput.files[0].type.startsWith('video') });
                closeModal('create-story-modal');
                renderStories();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function openStoryView(user, avatar, url, isVideo) {
            document.getElementById('story-user-name').innerText = user;
            document.getElementById('story-user-avatar').src = avatar;
            document.getElementById('story-media-container').innerHTML = isVideo ? '<video src="' + url + '" autoplay controls class="max-h-full rounded-2xl"></video>' : '<img src="' + url + '" class="max-h-full rounded-2xl object-contain">';
            openModal('view-story-modal');
        }

        function closeStoryView() { closeModal('view-story-modal'); }
        function logoutAccount() { localStorage.removeItem('omnix_active_user'); location.reload(); }
        function clearAllData() { if (confirm("Önbellek temizlensin mi?")) { localStorage.clear(); location.reload(); } }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
