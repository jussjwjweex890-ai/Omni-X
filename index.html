<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>GLB Görüntüleyici</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #1e1e1e; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 12px 20px; background: #2a2a2a; display: flex; align-items: center; gap: 12px; }
    model-viewer { flex: 1; width: 100%; background: #1e1e1e; }
  </style>
</head>
<body>
  <header>
    <input type="file" id="fileInput" accept=".glb,.gltf" />
    <span>Dosya seçin veya modeli fareyle döndürün / yakınlaştırın</span>
  </header>
  <model-viewer id="viewer" camera-controls auto-rotate shadow-intensity="1"></model-viewer>
  <script>
    const input = document.getElementById('fileInput');
    const viewer = document.getElementById('viewer');
    input.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) viewer.src = URL.createObjectURL(file);
    });
  </script>
</body>
</html>
