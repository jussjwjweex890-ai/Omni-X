<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI X</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        omni: {
                            black: '#000000',
                            card: 'rgba(255, 255, 255, 0.07)',
                            border: 'rgba(255, 255, 255, 0.15)',
                            neon: '#00ff87',
                            green: '#10b981'
                        }
                    },
                    boxShadow: {
                        'ios': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                        'neon': '0 0 20px rgba(0, 255, 135, 0.4)'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background: linear-gradient(180deg, #090a0f 0%, #000000 100%);
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* iOS Glassmorphism Styles */
        .ios-glass {
            background: rgba(30, 32, 40, 0.55);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .ios-glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .ios-nav-bar {
            background: rgba(20, 20, 25, 0.65);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .story-ring {
            background: linear-gradient(135deg, #00ff87, #60a5fa, #a855f7);
            padding: 2.5px;
        }
        .x-gradient-text {
            background: linear-gradient(135deg, #ffffff 0%, #a1a1aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-black text-white h-full min-h-screen pb-28">

    <!-- SIGNUP / LOGIN SCREEN WITH MULTI-LANGUAGE -->
    <div id="signup-screen" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-2xl flex items-center justify-center p-4 max-w-md mx-auto">
        <div class="w-full ios-glass rounded-3xl p-6 space-y-6 shadow-ios">
            <div class="flex justify-between items-center">
                <span class="font-black text-2xl tracking-widest text-emerald-400">OMNI X</span>
                <!-- Dil Seçimi -->
                <div class="relative">
                    <select id="language-select" onchange="changeLanguage(this.value)" class="bg-zinc-900/80 text-white text-xs border border-zinc-700/80 rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-emerald-400">
                        <option value="tr">🇹🇷 Türkçe</option>
                        <option value="en">🇺🇸 English</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="it">🇮🇹 Italiano</option>
                        <option value="ru">🇷🇺 Русский</option>
                        <option value="ar">🇸🇦 العربية</option>
                        <option value="ja">🇯🇵 日本語</option>
                        <option value="ko">🇰🇷 한국어</option>
                        <option value="zh">🇨🇳 中文</option>
                    </select>
                </div>
            </div>

            <div class="space-y-1">
                <h2 id="lbl-welcome" class="text-xl font-bold text-white">Hoş Geldiniz</h2>
                <p id="lbl-subtitle" class="text-xs text-zinc-400">Yeni nesil sosyal medya deneyimine katılın.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label id="lbl-fullname" class="text-[11px] text-zinc-300 font-semibold mb-1 block">İsim Soyisim</label>
                    <input type="text" id="signup-fullname" placeholder="Ahmet Yılmaz" class="w-full bg-black/50 border border-white/10 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-400 transition">
                </div>
                <div>
                    <label id="lbl-email" class="text-[11px] text-zinc-300 font-semibold mb-1 block">E-posta Adresi</label>
                    <input type="email" id="signup-email" placeholder="ornek@gmail.com" class="w-full bg-black/50 border border-white/10 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-400 transition">
                </div>
                <button id="btn-login" onclick="directRegisterOrLogin()" class="w-full bg-gradient-to-r from-emerald-400 via-teal-400 to-emerald-500 text-black font-extrabold py-3.5 rounded-2xl text-xs shadow-neon active:scale-95 transition">
                    GİRİŞ YAP / KAYIT OL
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="hidden">
        <!-- TOP HEADER (iOS GLASS STYLE) -->
        <header class="sticky top-0 z-40 px-4 py-3 max-w-md mx-auto">
            <div class="ios-glass rounded-2xl px-4 py-2.5 flex items-center justify-between">
                <span class="font-black text-xl tracking-wider text-emerald-400">OMNI X</span>
                <div class="flex items-center gap-3.5">
                    <button onclick="openModal('inbox-modal')" class="relative text-lg text-zinc-200 hover:text-emerald-400 transition">
                        <i class="far fa-bell"></i>
                        <span id="inbox-dot" class="absolute -top-0.5 -right-0.5 w-2 h-2 bg-emerald-400 rounded-full"></span>
                    </button>
                    <button onclick="openModal('dm-modal')" class="text-lg text-zinc-200 hover:text-emerald-400 transition">
                        <i class="far fa-paper-plane"></i>
                    </button>
                    <button onclick="openModal('settings-modal')" class="text-lg text-zinc-200 hover:text-emerald-400 transition">
                        <i class="fas fa-cog"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- APP CONTAINER -->
        <div class="max-w-md mx-auto relative px-2">
            <section id="tab-feed">
                <!-- STORIES BAR -->
                <div class="py-3 px-2 my-2 ios-glass rounded-2xl overflow-x-auto hide-scrollbar flex gap-4 items-center">
                    <div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="openModal('create-story-modal')">
                        <div class="story-ring w-14 h-14 rounded-full flex items-center justify-center relative">
                            <div id="my-story-avatar-container" class="w-full h-full rounded-full bg-zinc-900 flex items-center justify-center overflow-hidden border-2 border-black">
                                <i class="fas fa-user text-zinc-400 text-sm"></i>
                            </div>
                            <div class="absolute bottom-0 right-0 bg-emerald-400 text-black w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold border border-black">
                                <i class="fas fa-plus"></i>
                            </div>
                        </div>
                        <span class="text-[10px] text-zinc-300 font-medium">Hikayen</span>
                    </div>
                    <div id="stories-container" class="flex gap-4"></div>
                </div>

                <!-- FEED POSTS -->
                <div id="posts-container" class="space-y-4 pt-1"></div>
            </section>
        </div>

        <!-- BOTTOM NAVIGATION BAR (iOS 26 GLASS FLOATING BAR) -->
        <div class="fixed bottom-4 left-0 right-0 z-40 max-w-md mx-auto px-4">
            <nav class="ios-nav-bar rounded-3xl px-6 py-3 flex justify-between items-center">
                <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="text-emerald-400 text-xl hover:scale-110 transition"><i class="fas fa-home"></i></button>
                <button onclick="openModal('search-modal')" class="text-zinc-400 hover:text-emerald-400 text-xl hover:scale-110 transition"><i class="fas fa-search"></i></button>
                <button onclick="openModal('create-post-modal')" class="w-12 h-12 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-400 text-black flex items-center justify-center font-bold text-lg shadow-neon active:scale-90 transition"><i class="fas fa-plus"></i></button>
                <button onclick="openModal('dm-modal')" class="text-zinc-400 hover:text-emerald-400 text-xl hover:scale-110 transition"><i class="far fa-paper-plane"></i></button>
                <button onclick="openModal('inbox-modal')" class="text-zinc-400 hover:text-emerald-400 text-xl hover:scale-110 transition"><i class="far fa-bell"></i></button>
            </nav>
        </div>
    </div>

    <!-- MODALS (FULLSCREEN iOS GLASS STYLE) -->

    <!-- GELEN KUTUSU MODAL -->
    <div id="inbox-modal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl flex flex-col max-w-md mx-auto">
        <div class="ios-glass px-4 py-3 flex items-center justify-between border-b border-white/10">
            <h3 class="font-bold text-sm tracking-wider uppercase text-emerald-400"><i class="far fa-bell mr-1.5"></i> Gelen Kutusu & Bildirimler</h3>
            <button onclick="closeModal('inbox-modal')" class="text-zinc-400 text-base"><i class="fas fa-times"></i></button>
        </div>
        <div id="inbox-list" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    </div>

    <!-- ARAMA MODAL -->
    <div id="search-modal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl flex flex-col max-w-md mx-auto">
        <div class="ios-glass px-4 py-3 flex items-center justify-between border-b border-white/10">
            <h3 class="font-bold text-sm tracking-wider uppercase text-emerald-400"><i class="fas fa-search mr-1.5"></i> Keşfet & Arama</h3>
            <button onclick="closeModal('search-modal')" class="text-zinc-400 text-base"><i class="fas fa-times"></i></button>
        </div>
        <div class="p-4 space-y-4 flex-1 flex flex-col">
            <input type="text" id="video-search-input" oninput="searchVideosAndPosts(this.value)" placeholder="Kullanıcı veya içerik başlığı ara..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-400">
            <div id="search-results" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <p class="text-center text-xs text-zinc-500 py-12">Aradığınız kişi veya içeriği yazın...</p>
            </div>
        </div>
    </div>

    <!-- DM MESAJLAR MODAL -->
    <div id="dm-modal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl flex flex-col max-w-md mx-auto">
        <div class="ios-glass px-4 py-3 flex items-center justify-between border-b border-white/10">
            <h3 class="font-bold text-sm tracking-wider uppercase text-emerald-400"><i class="far fa-paper-plane mr-1.5"></i> Mesajlar (DM)</h3>
            <button onclick="closeModal('dm-modal')" class="text-zinc-400 text-base"><i class="fas fa-times"></i></button>
        </div>
        <div id="chat-list" class="flex-1 overflow-y-auto p-4 space-y-2.5"></div>
        <div id="chat-active-view" class="hidden flex-1 flex flex-col p-4 space-y-3">
            <div class="flex items-center justify-between border-b border-white/10 pb-2">
                <div class="flex items-center gap-2.5">
                    <img id="chat-target-avatar" src="" class="w-8 h-8 rounded-full object-cover border border-emerald-400">
                    <span id="chat-target-name" class="text-xs font-bold text-emerald-400">Sohbet</span>
                </div>
                <button onclick="closeActiveChat()" class="text-xs text-zinc-300 bg-white/10 px-3 py-1 rounded-xl hover:bg-white/20">Geri Dön</button>
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2.5 pr-1"></div>
            <div class="flex gap-2 pt-2 border-t border-white/10">
                <input type="text" id="chat-input" placeholder="Mesaj yaz..." class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-emerald-400">
                <button onclick="sendMessage()" class="bg-emerald-400 text-black px-4 py-3 rounded-2xl text-xs font-bold shadow-neon"><i class="fas fa-arrow-right"></i></button>
            </div>
        </div>
    </div>

    <!-- YORUMLAR MODAL -->
    <div id="comments-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-md flex items-end">
        <div class="ios-glass w-full max-w-md mx-auto rounded-t-3xl p-4 space-y-3 shadow-ios flex flex-col h-[55vh]">
            <div class="w-10 h-1 bg-zinc-600/80 rounded-full mx-auto mb-1"></div>
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400"><i class="far fa-comment mr-1"></i> Yorumlar</h3>
                <button onclick="closeModal('comments-modal')" class="text-zinc-400 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div id="comments-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
            <div id="replying-to-bar" class="hidden flex justify-between items-center bg-white/5 px-3 py-1.5 rounded-xl text-[11px] text-emerald-400 border border-emerald-400/30">
                <span id="replying-to-text"></span>
                <button onclick="cancelReply()" class="text-zinc-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex gap-2 pt-1 border-t border-white/10">
                <input type="text" id="comment-input" placeholder="Yorum ekle..." class="flex-1 bg-black/40 border border-white/10 rounded-2xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-400">
                <button onclick="addCommentToPost()" class="bg-emerald-400 text-black px-4 py-2.5 rounded-2xl text-xs font-bold shadow-neon">Gönder</button>
            </div>
        </div>
    </div>

    <!-- CREATE POST MODAL -->
    <div id="create-post-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="ios-glass w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-ios">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400">Yeni Paylaşım</h3>
                <button onclick="closeModal('create-post-modal')" class="text-zinc-400 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-3">
                <input type="file" id="post-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-400/20 file:text-emerald-400 cursor-pointer">
                <textarea id="post-caption-input" rows="3" placeholder="Açıklama yaz..." class="w-full bg-black/40 border border-white/10 rounded-2xl p-3 text-xs text-white focus:outline-none focus:border-emerald-400"></textarea>
                <div id="post-media-preview" class="hidden relative rounded-2xl overflow-hidden max-h-36 bg-black flex items-center justify-center"></div>
                <button onclick="toggleGifSearch()" class="w-full bg-black/40 border border-white/10 text-emerald-400 py-2.5 rounded-2xl text-xs font-semibold hover:border-emerald-400/40 transition flex items-center justify-center gap-2">
                    <i class="fas fa-gift"></i> GIF Arayıp Ekle (Tenor)
                </button>
            </div>
            <button onclick="submitNewPost()" class="w-full bg-emerald-400 text-black font-black py-3 rounded-2xl text-xs shadow-neon">Paylaş</button>
        </div>
    </div>

    <!-- GIF PICKER MODAL -->
    <div id="gif-picker-modal" class="hidden fixed inset-0 z-[60] bg-black/90 backdrop-blur-2xl flex items-center justify-center p-4">
        <div class="ios-glass w-full max-w-sm rounded-3xl p-4 space-y-3 shadow-ios flex flex-col h-[65vh]">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400">GIF Arama</h3>
                <button onclick="closeModal('gif-picker-modal')" class="text-zinc-400"><i class="fas fa-times"></i></button>
            </div>
            <input type="text" id="gif-search-box" placeholder="GIF ara..." oninput="searchGifs(this.value)" class="w-full bg-black/40 border border-white/10 rounded-2xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-emerald-400">
            <div id="gif-results-grid" class="grid grid-cols-2 gap-2 overflow-y-auto max-h-60 pr-1">
                <p class="col-span-2 text-center text-xs text-zinc-500 py-8">Arama yapmak için kelime yazın...</p>
            </div>
        </div>
    </div>

    <!-- CREATE STORY MODAL -->
    <div id="create-story-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="ios-glass w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-ios">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400">Hikaye Ekle</h3>
                <button onclick="closeModal('create-story-modal')" class="text-zinc-400 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <input type="file" id="story-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-400/20 file:text-emerald-400 cursor-pointer">
            <button onclick="submitNewStory()" class="w-full bg-emerald-400 text-black font-black py-3 rounded-2xl text-xs shadow-neon">Hikayelere Ekle</button>
        </div>
    </div>

    <!-- VIEW STORY MODAL -->
    <div id="view-story-modal" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between p-4 max-w-md mx-auto">
        <div class="flex items-center justify-between py-2 border-b border-white/10">
            <div class="flex items-center gap-2.5">
                <div id="story-user-avatar-view" class="w-8 h-8 rounded-full bg-zinc-800 flex items-center justify-center text-zinc-400 text-xs overflow-hidden">
                    <i class="fas fa-user"></i>
                </div>
                <span id="story-user-name" class="font-bold text-xs text-white"></span>
            </div>
            <button onclick="closeStoryView()" class="text-white text-base"><i class="fas fa-times"></i></button>
        </div>
        <div id="story-media-container" class="flex-1 flex items-center justify-center my-2 overflow-hidden"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-xl flex items-center justify-center p-4">
        <div class="ios-glass w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-ios">
            <div class="flex justify-between items-center border-b border-white/10 pb-2">
                <h3 class="font-bold text-xs uppercase tracking-wider text-emerald-400"><i class="fas fa-cog mr-1"></i> Ayarlar</h3>
                <button onclick="closeModal('settings-modal')" class="text-zinc-400 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-2 text-xs">
                <button onclick="clearAllData()" class="w-full text-left p-3 rounded-2xl bg-white/5 border border-white/10 text-amber-400 hover:bg-white/10 transition">Önbelleği Temizle</button>
                <button onclick="logoutAccount()" class="w-full text-left p-3 rounded-2xl bg-white/5 border border-white/10 text-emerald-400 hover:bg-white/10 transition">Çıkış Yap</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        // DÜZELTİLMİŞ BOT FOTOĞRAFI
        var BOT_AVATAR = "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300";
        var BOT_STORY_MEDIA = "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600";

        var i18n = {
            tr: { welcome: "Hoş Geldiniz", subtitle: "Yeni nesil sosyal medya deneyimine katılın.", fullname: "İsim Soyisim", email: "E-posta Adresi", btnLogin: "GİRİŞ YAP / KAYIT OL" },
            en: { welcome: "Welcome", subtitle: "Join the next generation social experience.", fullname: "Full Name", email: "Email Address", btnLogin: "LOGIN / REGISTER" },
            de: { welcome: "Willkommen", subtitle: "Treten Sie der nächsten Social-Media-Generation bei.", fullname: "Vollständiger Name", email: "E-Mail-Adresse", btnLogin: "ANMELDEN / REGISTRIEREN" },

            it: { welcome: "Benvenuto", subtitle: "Unisciti all'esperienza social di nuova generazione.", fullname: "Nome Completo", email: "Indirizzo Email", btnLogin: "ACCEDI / REGISTRATI" },
            ru: { welcome: "Добро пожаловать", subtitle: "Присоединяйтесь к новому поколению соцсетей.", fullname: "Полное имя", email: "Эл. адрес", btnLogin: "ВОЙТИ / ЗАРЕГИСТРИРОВАТЬСЯ" },

            zh: { welcome: "欢迎", subtitle: "加入下一代社交体验。", fullname: "全名", email: "电子邮件地址", btnLogin: "登录 / 注册" }

        var state = {
            lang: "tr",
            currentUser: null,
            followingUsers: ["Can_Tech"],
            notifications: [
                { id: 1, type: "follow", user: "Can_Tech", text: "seni takip etmeye başladı.", time: "Şimdi" },
                { id: 2, type: "dm", user: "Can_Tech", text: "sana bir mesaj gönderdi.", time: "2dk önce" }
            ],
            stories: [
                { id: 1, user: "Can_Tech", avatar: BOT_AVATAR, url: BOT_STORY_MEDIA, isVideo: false }
            ],
            posts: [
                {
                    id: 101,
                    user: "Can_Tech",
                    avatar: BOT_AVATAR,
                    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                    isVideo: true,
                    caption: "Ben Can_Tech AI! OMNI X yapay zekasıyım. İstediğin her soruyu bana sorabilirsin! 🚀🤖",
                    likes: 128,
                    liked: false,
                    comments: [{ id: 1, user: "Can_Tech", text: "Sorularını bekliyorum!", replies: [] }]
                }
            ],
            chats: {
                "Can_Tech": [
                    { sender: "Can_Tech", text: "Merhaba! Ben Can_Tech yapay zeka asistanın. İstediğin her konuda bana soru sorabilirsin!" }
                ]
            },
            activeChatUser: null,
            activeCommentPostId: null,
            replyingToCommentUser: null,
            selectedMediaUrl: null
        };

        window.onload = function() {
            loadSavedDatabase();
            if (!state.currentUser) {
                document.getElementById('signup-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            } else {
                document.getElementById('signup-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initMainApp();
            }
        };

        function changeLanguage(langCode) {
            state.lang = langCode;
            var t = i18n[langCode] || i18n.tr;
            document.getElementById('lbl-welcome').innerText = t.welcome;
            document.getElementById('lbl-subtitle').innerText = t.subtitle;
            document.getElementById('lbl-fullname').innerText = t.fullname;
            document.getElementById('lbl-email').innerText = t.email;
            document.getElementById('btn-login').innerText = t.btnLogin;
        }

        function loadSavedDatabase() {
            try {
                var savedUser = localStorage.getItem('omnix_active_user');
                if (savedUser) { state.currentUser = JSON.parse(savedUser); }
                var savedPosts = localStorage.getItem('omnix_posts_data');
                if (savedPosts) { state.posts = JSON.parse(savedPosts); }
                var savedFollowing = localStorage.getItem('omnix_following_users');
                if (savedFollowing) { state.followingUsers = JSON.parse(savedFollowing); }
            } catch(e){}
        }

        function directRegisterOrLogin() {
            var fullname = document.getElementById('signup-fullname').value.trim();
            var email = document.getElementById('signup-email').value.trim().toLowerCase();
            if (!email) { alert("Lütfen e-posta giriniz!"); return; }

            state.currentUser = {
                username: email.split('@')[0],
                name: fullname || email.split('@')[0],
                email: email,
                avatar: ""
            };
            localStorage.setItem('omnix_active_user', JSON.stringify(state.currentUser));
            document.getElementById('signup-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            initMainApp();
        }

        function initMainApp() {
            if (state.currentUser) {
                var container = document.getElementById('my-story-avatar-container');
                container.innerHTML = '<i class="fas fa-user text-zinc-400 text-sm"></i>';
            }
            renderStories();
            renderPosts();
            renderChatList();
            renderInbox();
        }

        function renderInbox() {
            var list = document.getElementById('inbox-list');
            list.innerHTML = state.notifications.map(function(n) {
                var icon = n.type === 'follow' ? '<i class="fas fa-user-plus"></i>' : (n.type === 'dm' ? '<i class="far fa-paper-plane"></i>' : '<i class="fas fa-heart"></i>');
                return '<div class="flex items-center justify-between p-3.5 rounded-2xl ios-glass-card">' +
                    '<div class="flex items-center gap-3">' +
                        '<div class="w-9 h-9 rounded-full bg-emerald-400/20 text-emerald-400 flex items-center justify-center font-bold text-xs">' + icon + '</div>' +
                        '<div>' +
                            '<p class="text-xs text-white"><span class="font-bold text-emerald-400">' + n.user + '</span> ' + n.text + '</p>' +
                            '<span class="text-[10px] text-zinc-400">' + n.time + '</span>' +
                        '</div>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderStories() {
            var container = document.getElementById('stories-container');
            container.innerHTML = state.stories.map(function(s) {
                var avContent = s.avatar ? '<img src="' + s.avatar + '" class="w-full h-full object-cover rounded-full">' : '<i class="fas fa-user text-zinc-400 text-xs"></i>';
                return '<div onclick="openStoryView(\'' + s.user + '\', \'' + s.avatar + '\', \'' + s.url + '\', ' + s.isVideo + ')" class="flex flex-col items-center gap-1 shrink-0 cursor-pointer">' +
                    '<div class="story-ring w-14 h-14 rounded-full flex items-center justify-center">' +
                        '<div class="w-full h-full rounded-full bg-zinc-900 flex items-center justify-center overflow-hidden border-2 border-black">' + avContent + '</div>' +
                    '</div>' +
                    '<span class="text-[10px] text-zinc-300 truncate w-14 text-center">' + s.user + '</span>' +
                '</div>';
            }).join('');
        }

        function renderPosts() {
            var container = document.getElementById('posts-container');
            container.innerHTML = state.posts.map(function(p) {
                var isFollowing = state.followingUsers.includes(p.user);
                var followBtn = (p.user !== state.currentUser.username) ? 
                    '<button onclick="toggleFollow(\'' + p.user + '\')" class="text-[11px] px-3.5 py-1 rounded-full font-bold transition ' + (isFollowing ? 'bg-white/10 text-zinc-300' : 'bg-emerald-400 text-black shadow-neon') + '">' +
                        (isFollowing ? 'Takiptesin' : 'Takip Et') +
                    '</button>' : '';

                var avContent = p.avatar ? '<img src="' + p.avatar + '" class="w-full h-full object-cover rounded-full">' : '<i class="fas fa-user text-zinc-400 text-xs"></i>';
                var media = p.isVideo ? 
                    '<video src="' + p.url + '" muted playsinline preload="auto" class="w-full max-h-[420px] object-cover rounded-2xl"></video>' : 
                    '<img src="' + p.url + '" class="w-full max-h-[420px] object-cover rounded-2xl">';

                return '<article class="post-item ios-glass rounded-3xl overflow-hidden p-3 space-y-3">' +
                    '<div class="flex items-center justify-between">' +
                        '<div class="flex items-center gap-2.5">' +
                            '<div class="story-ring w-8 h-8 rounded-full flex items-center justify-center">' +
                                '<div class="w-full h-full rounded-full bg-zinc-900 flex items-center justify-center overflow-hidden border border-black">' + avContent + '</div>' +
                            '</div>' +
                            '<span class="font-bold text-xs text-white">' + p.user + '</span>' +
                        '</div>' + followBtn +
                    '</div>' +
                    '<div class="relative overflow-hidden bg-black flex items-center justify-center max-h-[420px] rounded-2xl">' + media + '</div>' +
                    '<div class="space-y-1.5 px-1">' +
                        '<div class="flex justify-between items-center text-lg">' +
                            '<div class="flex gap-4">' +
                                '<button onclick="toggleLike(' + p.id + ')" class="' + (p.liked ? 'text-emerald-400' : 'text-zinc-300') + ' transition"><i class="' + (p.liked ? 'fas' : 'far') + ' fa-heart"></i></button>' +
                                '<button onclick="openCommentsModal(' + p.id + ')" class="text-zinc-300 hover:text-emerald-400 transition"><i class="far fa-comment"></i></button>' +
                                '<button onclick="openChatWith(\'' + p.user + '\')" class="text-zinc-300 hover:text-emerald-400 transition"><i class="far fa-paper-plane"></i></button>' +
                            '</div>' +
                        '</div>' +
                        '<p class="font-bold text-xs text-emerald-400">' + (p.likes || 0) + ' beğenme</p>' +
                        '<p class="text-xs text-zinc-200"><span class="font-bold mr-1 text-white">' + p.user + '</span>' + p.caption + '</p>' +
                    '</div>' +
                '</article>';
            }).join('');

            setupVideoIntersectionObserver();
        }

        function toggleFollow(username) {
            if (state.followingUsers.includes(username)) {
                state.followingUsers = state.followingUsers.filter(function(u){ return u !== username; });
            } else {
                state.followingUsers.push(username);
                state.notifications.unshift({ id: Date.now(), type: "follow", user: state.currentUser.username, text: username + " kullanıcısını takip ettin.", time: "Şimdi" });
            }
            localStorage.setItem('omnix_following_users', JSON.stringify(state.followingUsers));
            renderPosts();
            renderInbox();
        }

        function searchVideosAndPosts(query) {
            var resultsContainer = document.getElementById('search-results');
            if (!query.trim()) {
                resultsContainer.innerHTML = '<p class="text-center text-xs text-zinc-500 py-12">Aradığınız kişi veya içeriği yazın...</p>';
                return;
            }

            var filtered = state.posts.filter(function(p){ 
                return p.caption.toLowerCase().includes(query.toLowerCase()) || p.user.toLowerCase().includes(query.toLowerCase()); 
            });

            if (filtered.length === 0) {
                resultsContainer.innerHTML = '<p class="text-center text-xs text-zinc-500 py-12">Sonuç bulunamadı.</p>';
                return;
            }

            resultsContainer.innerHTML = filtered.map(function(p){
                var media = p.isVideo ? '<video src="' + p.url + '" class="w-full h-full object-cover"></video>' : '<img src="' + p.url + '" class="w-full h-full object-cover">';
                return '<div class="flex items-center gap-3 p-3 rounded-2xl ios-glass-card">' +
                    '<div class="w-12 h-12 rounded-xl bg-black overflow-hidden shrink-0 flex items-center justify-center">' + media + '</div>' +
                    '<div class="flex-1 truncate">' +
                        '<p class="font-bold text-xs text-white">' + p.user + '</p>' +
                        '<p class="text-[10px] text-zinc-400 truncate">' + p.caption + '</p>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function renderChatList() {
            var list = document.getElementById('chat-list');
            var users = state.followingUsers;
            if (users.length === 0) {
                list.innerHTML = '<p class="text-center text-xs text-zinc-500 py-12">Mesajlaşmak için kullanıcıları takip etmelisin.</p>';
                return;
            }

            list.innerHTML = users.map(function(u){
                var avatarHtml = u === "Can_Tech" ? '<img src="' + BOT_AVATAR + '" class="w-full h-full object-cover rounded-full">' : '<i class="fas fa-user"></i>';
                return '<div onclick="openChatWith(\'' + u + '\')" class="flex items-center justify-between p-3.5 rounded-2xl ios-glass-card cursor-pointer hover:border-emerald-400/40 transition">' +
                    '<div class="flex items-center gap-3">' +
                        '<div class="w-9 h-9 rounded-full bg-zinc-800 text-zinc-400 flex items-center justify-center text-xs overflow-hidden">' + avatarHtml + '</div>' +
                        '<span class="text-xs font-bold text-white">' + u + '</span>' +
                    '</div>' +
                    '<i class="fas fa-chevron-right text-xs text-zinc-500"></i>' +
                '</div>';
            }).join('');
        }

        function openChatWith(username) {
            state.activeChatUser = username;
            if (!state.chats[username]) state.chats[username] = [];
            document.getElementById('chat-target-name').innerText = '@' + username;
            
            var avatarEl = document.getElementById('chat-target-avatar');
            if(username === "Can_Tech") {
                avatarEl.src = BOT_AVATAR;
                avatarEl.classList.remove('hidden');
            } else {
                avatarEl.classList.add('hidden');
            }

            document.getElementById('chat-list').classList.add('hidden');
            document.getElementById('chat-active-view').classList.remove('hidden');
            renderMessages();
        }

        function closeActiveChat() {
            state.activeChatUser = null;
            document.getElementById('chat-active-view').classList.add('hidden');
            document.getElementById('chat-list').classList.remove('hidden');
        }

        function renderMessages() {
            var container = document.getElementById('chat-messages');
            var msgs = state.chats[state.activeChatUser] || [];
            container.innerHTML = msgs.map(function(m){
                var isMe = m.sender === state.currentUser.username;
                return '<div class="flex flex-col ' + (isMe ? 'items-end' : 'items-start') + '">' +
                    '<div class="max-w-[80%] p-3 rounded-2xl text-xs ' + (isMe ? 'bg-emerald-400 text-black font-bold' : 'ios-glass-card text-white') + '">' + m.text + '</div>' +
                '</div>';
            }).join('');
            container.scrollTop = container.scrollHeight;
        }

        function generateAiResponse(prompt) {
            var p = prompt.toLowerCase();
            if (p.includes("merhaba") || p.includes("selam")) return "Selam! Sana nasıl yardımcı olabilirim?";
            if (p.includes("kimsin") || p.includes("nedir")) return "Ben OMNI X yapay zeka asistanı Can_Tech'im. Sorularını yanıtlamak için buradayım!";
            if (p.includes("saat") || p.includes("zaman")) return "Zaman OMNI X dünyasında su gibi akıyor! 🚀";
            if (p.includes("teşekkür")) return "Rica ederim, her zaman buradayım!";
            return "Harika bir soru! '" + prompt + "' hakkında sana yardımcı olmaktan mutluluk duyarım. Başka bir şey öğrenmek ister misin?";
        }

        function sendMessage() {
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (!text || !state.activeChatUser) return;

            state.chats[state.activeChatUser].push({ sender: state.currentUser.username, text: text });
            input.value = '';
            renderMessages();

            if (state.activeChatUser === "Can_Tech") {
                setTimeout(function() {
                    var reply = generateAiResponse(text);
                    state.chats["Can_Tech"].push({ sender: "Can_Tech", text: reply });
                    renderMessages();
                }, 800);
            }
        }

        function openCommentsModal(postId) {
            state.activeCommentPostId = postId;
            renderComments();
            openModal('comments-modal');
        }

        function renderComments() {
            var post = state.posts.find(function(p){ return p.id === state.activeCommentPostId; });
            var list = document.getElementById('comments-list');
            if (!post || !post.comments || post.comments.length === 0) {
                list.innerHTML = '<p class="text-center text-xs text-zinc-500 py-6">Henüz yorum yapılmamış.</p>';
                return;
            }
            list.innerHTML = post.comments.map(function(c){
                var repliesHtml = (c.replies && c.replies.length > 0) ? 
                    '<div class="pl-3 border-l-2 border-emerald-400/40 space-y-1 mt-1.5">' +
                        c.replies.map(function(r){
                            return '<div class="text-[11px]"><span class="font-bold text-emerald-300">' + r.user + ':</span> <span class="text-zinc-300">' + r.text + '</span></div>';
                        }).join('') +
                    '</div>' : '';

                return '<div class="ios-glass-card p-3 rounded-2xl text-xs space-y-1">' +
                    '<div class="flex justify-between items-center">' +
                        '<span class="font-bold text-emerald-400">' + c.user + '</span>' +
                        '<button onclick="startReplyTo(\'' + c.user + '\')" class="text-[10px] text-zinc-400 hover:text-emerald-400 flex items-center gap-1"><i class="fas fa-reply"></i> Yanıtla</button>' +
                    '</div>' +
                    '<p class="text-zinc-200">' + c.text + '</p>' + repliesHtml +
                '</div>';
            }).join('');
        }

        function startReplyTo(user) {
            state.replyingToCommentUser = user;
            document.getElementById('replying-to-text').innerText = '@' + user + ' kullanıcısına yanıt veriyorsun';
            document.getElementById('replying-to-bar').classList.remove('hidden');
            document.getElementById('comment-input').focus();
        }

        function cancelReply() {
            state.replyingToCommentUser = null;
            document.getElementById('replying-to-bar').classList.add('hidden');
        }

        function addCommentToPost() {
            var input = document.getElementById('comment-input');
            var text = input.value.trim();
            if(!text || !state.activeCommentPostId) return;

            var post = state.posts.find(function(p){ return p.id === state.activeCommentPostId; });
            if(post) {
                if(!post.comments) post.comments = [];
                if (state.replyingToCommentUser) {
                    var targetComment = post.comments.find(function(c){ return c.user === state.replyingToCommentUser; });
                    if (targetComment) {
                        if (!targetComment.replies) targetComment.replies = [];
                        targetComment.replies.push({ user: state.currentUser.username, text: text });
                    }
                    cancelReply();
                } else {
                    post.comments.push({ id: Date.now(), user: state.currentUser.username, text: text, replies: [] });
                }
                savePostsState();
                input.value = '';
                renderComments();
                renderPosts();
            }
        }

        // VİDEO OYNATMA MANTIĞI (%25 Giriş -> Oynat, %75 -> Sesi Aç)
        function setupVideoIntersectionObserver() {
            var observerOptions = { root: null, threshold: [0, 0.25, 0.75, 1.0] };
            var observer = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    var video = entry.target.querySelector('video');
                    if (!video) return;
                    if (entry.intersectionRatio >= 0.25) {
                        video.play().catch(function(){});
                        if (entry.intersectionRatio >= 0.75) { video.muted = false; } 
                        else { video.muted = true; }
                    } else {
                        video.pause();
                        video.muted = true;
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.post-item').forEach(function(item) {
                observer.observe(item);
            });
        }

        function toggleLike(postId) {
            var post = state.posts.find(function(p){ return p.id === postId; });
            if(post) {
                post.liked = !post.liked;
                post.likes = (post.likes || 0) + (post.liked ? 1 : -1);
                savePostsState();
                renderPosts();
            }
        }

        function savePostsState() {
            try { localStorage.setItem('omnix_posts_data', JSON.stringify(state.posts)); } catch(e){}
        }

        function toggleGifSearch() { openModal('gif-picker-modal'); }

        async function searchGifs(query) {
            var grid = document.getElementById('gif-results-grid');
            if (!query.trim()) {
                grid.innerHTML = '<p class="col-span-2 text-center text-xs text-zinc-500 py-8">Arama yapmak için kelime yazın...</p>';
                return;
            }
            try {
                var res = await fetch('https://g.tenor.com/v1/search?q=' + encodeURIComponent(query) + '&key=LIVDSRZULELA&limit=10');
                var data = await res.json();
                if (data && data.results) {
                    grid.innerHTML = data.results.map(function(g){
                        return '<div onclick="selectGif(\'' + g.media[0].gif.url + '\')" class="cursor-pointer rounded-2xl overflow-hidden border border-white/10 hover:border-emerald-400 bg-black h-28 flex items-center justify-center">' +
                            '<img src="' + g.media[0].gif.url + '" class="w-full h-full object-cover">' +
                        '</div>';
                    }).join('');
                }
            } catch(e) {
                grid.innerHTML = '<p class="col-span-2 text-center text-xs text-red-400 py-8">GIF araması başarısız.</p>';
            }
        }

        function selectGif(url) {
            state.selectedMediaUrl = url;
            var preview = document.getElementById('post-media-preview');
            preview.innerHTML = '<img src="' + url + '" class="w-full h-full object-cover rounded-xl">';
            preview.classList.remove('hidden');
            closeModal('gif-picker-modal');
        }

        function submitNewPost() {
            var fileInput = document.getElementById('post-file-input');
            var caption = document.getElementById('post-caption-input').value.trim();

            if (!state.selectedMediaUrl && (!fileInput.files || !fileInput.files[0]) && !caption) {
                alert("Lütfen medya, GIF veya yazı ekleyin!");
                return;
            }

            if (state.selectedMediaUrl) {
                createPostFinal(state.selectedMediaUrl, false, caption);
            } else if (fileInput.files && fileInput.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    createPostFinal(e.target.result, fileInput.files[0].type.startsWith('video'), caption);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                createPostFinal(null, false, caption);
            }
        }

        function createPostFinal(url, isVideo, caption) {
            state.posts.unshift({
                id: Date.now(),
                user: state.currentUser.username,
                avatar: state.currentUser.avatar,
                url: url,
                isVideo: isVideo,
                caption: caption || "",
                likes: 0,
                liked: false,
                comments: []
            });
            savePostsState();
            state.selectedMediaUrl = null;
            document.getElementById('post-media-preview').classList.add('hidden');
            document.getElementById('post-caption-input').value = '';
            document.getElementById('post-file-input').value = '';
            closeModal('create-post-modal');
            renderPosts();
        }

        function submitNewStory() {
            var fileInput = document.getElementById('story-file-input');
            if (!fileInput.files || !fileInput.files[0]) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                state.stories.unshift({ id: Date.now(), user: state.currentUser.username, avatar: state.currentUser.avatar, url: e.target.result, isVideo: fileInput.files[0].type.startsWith('video') });
                closeModal('create-story-modal');
                renderStories();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function openStoryView(user, avatar, url, isVideo) {
            document.getElementById('story-user-name').innerText = user;
            var avView = document.getElementById('story-user-avatar-view');
            avView.innerHTML = avatar ? '<img src="' + avatar + '" class="w-full h-full object-cover">' : '<i class="fas fa-user text-zinc-400 text-xs"></i>';
            document.getElementById('story-media-container').innerHTML = isVideo ? '<video src="' + url + '" autoplay controls class="max-h-full rounded-2xl"></video>' : '<img src="' + url + '" class="max-h-full rounded-2xl object-contain">';
            openModal('view-story-modal');
        }

        function closeStoryView() { closeModal('view-story-modal'); }
        function logoutAccount() { localStorage.removeItem('omnix_active_user'); location.reload(); }
        function clearAllData() { if (confirm("Önbellek temizlensin mi?")) { localStorage.clear(); location.reload(); } }
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
