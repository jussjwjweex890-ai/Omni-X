<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>X-Social</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        xblack: '#0d0e12',
                        xcard: '#16181f',
                        xborder: '#262933',
                        xblue: '#1d9bf0'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #0d0e12;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .story-ring {
            background: linear-gradient(135deg, #ec4899, #8b5cf6, #3b82f6);
            padding: 2px;
        }
    </style>
</head>
<body class="bg-[#0d0e12] text-white h-full min-h-screen pb-24">

    <!-- SIGNUP / LOGIN SCREEN -->
    <div id="signup-screen" class="hidden fixed inset-0 z-50 bg-[#0d0e12] flex items-center justify-center p-4 max-w-md mx-auto">
        <div class="w-full bg-[#16181f] border border-[#262933] rounded-3xl p-6 space-y-5">
            <div class="flex justify-between items-center border-b border-[#262933] pb-3">
                <h1 class="text-2xl font-black text-white tracking-wider">X-Social</h1>
            </div>

            <div class="space-y-3.5">
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">İsim Soyisim</label>
                    <input type="text" id="signup-fullname" placeholder="Örn: Ali Yılmaz" class="w-full bg-[#0d0e12] border border-[#262933] rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">E-posta Adresi</label>
                    <input type="email" id="signup-email" placeholder="ornek@gmail.com" class="w-full bg-[#0d0e12] border border-[#262933] rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-blue-500">
                </div>

                <div class="pt-1">
                    <button onclick="directRegisterOrLogin()" class="w-full bg-white text-black font-extrabold py-3 rounded-xl text-xs hover:bg-zinc-200 transition">
                        Giriş Yap / Kayıt Ol
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="hidden">
        <!-- TOP HEADER -->
        <header class="sticky top-0 z-40 bg-[#0d0e12]/90 backdrop-blur-md border-b border-[#262933] px-4 py-3 flex items-center justify-between max-w-md mx-auto">
            <span class="font-extrabold text-xl text-white tracking-wide">X-Social</span>
            <div class="flex items-center gap-4 text-zinc-300">
                <button onclick="openModal('settings-modal')"><i class="fas fa-cog text-lg"></i></button>
                <button onclick="openModal('messages-modal')"><i class="far fa-[#262933] fa-comment-alt text-lg"></i></button>
            </div>
        </header>

        <!-- APP CONTAINER -->
        <div class="max-w-md mx-auto relative">

            <!-- MAIN FEED -->
            <section id="tab-feed">
                <!-- STORIES BAR -->
                <div class="py-3 px-3 border-b border-[#262933] bg-[#0d0e12]">
                    <h2 class="text-xs font-semibold text-zinc-400 mb-2">Hikayeler</h2>
                    <div class="overflow-x-auto hide-scrollbar flex gap-3.5 items-center">
                        <!-- Add Story -->
                        <div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="openModal('create-story-modal')">
                            <div class="relative w-14 h-14 rounded-full p-0.5 border-2 border-dashed border-zinc-600 flex items-center justify-center">
                                <img id="my-story-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-full h-full object-cover rounded-full">
                                <div class="absolute bottom-0 right-0 bg-blue-500 text-white w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold border border-[#0d0e12]">
                                    <i class="fas fa-plus"></i>
                                </div>
                            </div>
                            <span class="text-[10px] text-zinc-300 truncate w-14 text-center">Sen+</span>
                        </div>

                        <!-- Story Items -->
                        <div id="stories-container" class="flex gap-3.5"></div>
                    </div>
                </div>

                <!-- FEED POSTS -->
                <div id="posts-container" class="space-y-4 p-3"></div>
            </section>

        </div>

        <!-- FLOATING 'YENİ GÖNDERİ' BUTTON -->
        <button onclick="openModal('create-post-modal')" class="fixed bottom-20 right-4 z-40 bg-white text-black font-bold px-4 py-2 rounded-full text-xs shadow-lg flex items-center gap-1.5 active:scale-95 transition">
            <span>Yeni Gönderi</span>
        </button>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#0d0e12]/95 backdrop-blur-md border-t border-[#262933] max-w-md mx-auto px-6 py-3 flex justify-between items-center text-zinc-400">
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="text-white text-lg"><i class="fas fa-home"></i></button>
            <button class="hover:text-white text-lg"><i class="fas fa-search"></i></button>
            <button onclick="openModal('create-post-modal')" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center font-bold text-base shadow-md"><i class="fas fa-plus"></i></button>
            <button class="hover:text-white text-lg"><i class="far fa-heart"></i></button>
            <button onclick="openModal('profile-modal')" class="hover:text-white text-lg"><i class="far fa-user"></i></button>
        </nav>
    </div>

    <!-- MODALS -->

    <!-- CREATE POST MODAL -->
    <div id="create-post-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#16181f] border border-[#262933] w-full max-w-sm rounded-2xl p-4 space-y-4">
            <div class="flex justify-between items-center border-b border-[#262933] pb-2">
                <h3 class="font-bold text-sm text-white">Yeni Gönderi Paylaş</h3>
                <button onclick="closeModal('create-post-modal')" class="text-zinc-400 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-zinc-400 mb-1 block">Fotoğraf veya Video Seç</label>
                    <input type="file" id="post-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-zinc-200 cursor-pointer">
                </div>
                <textarea id="post-caption-input" rows="3" placeholder="Neler oluyor? #doga #gezi" class="w-full bg-[#0d0e12] border border-[#262933] rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-blue-500"></textarea>
            </div>
            <button onclick="submitNewPost()" class="w-full bg-white text-black font-bold py-2.5 rounded-xl text-xs">Paylaş</button>
        </div>
    </div>

    <!-- CREATE STORY MODAL -->
    <div id="create-story-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#16181f] border border-[#262933] w-full max-w-sm rounded-2xl p-4 space-y-4">
            <div class="flex justify-between items-center border-b border-[#262933] pb-2">
                <h3 class="font-bold text-sm text-white">Hikaye Ekle</h3>
                <button onclick="closeModal('create-story-modal')" class="text-zinc-400 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div>
                <input type="file" id="story-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-zinc-800 file:text-zinc-200 cursor-pointer">
            </div>
            <button onclick="submitNewStory()" class="w-full bg-white text-black font-bold py-2.5 rounded-xl text-xs">Hikayelere Ekle</button>
        </div>
    </div>

    <!-- VIEW STORY MODAL -->
    <div id="view-story-modal" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between p-4 max-w-md mx-auto">
        <div class="flex items-center justify-between py-2 border-b border-zinc-800">
            <div class="flex items-center gap-2">
                <img id="story-user-avatar" src="" class="w-8 h-8 rounded-full object-cover">
                <span id="story-user-name" class="font-bold text-xs text-white"></span>
            </div>
            <button onclick="closeStoryView()" class="text-white text-base"><i class="fas fa-times"></i></button>
        </div>
        <div id="story-media-container" class="flex-1 flex items-center justify-center my-2 overflow-hidden"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-[#16181f] border border-[#262933] w-full max-w-sm rounded-2xl p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-[#262933] pb-2">
                <h3 class="font-bold text-sm text-white">Ayarlar</h3>
                <button onclick="closeModal('settings-modal')" class="text-zinc-400 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-2 text-xs">
                <button onclick="clearAllData()" class="w-full text-left p-2.5 rounded-xl bg-[#0d0e12] border border-[#262933] text-amber-400">Önbelleği Temizle</button>
                <button onclick="logoutAccount()" class="w-full text-left p-2.5 rounded-xl bg-[#0d0e12] border border-[#262933] text-red-400">Çıkış Yap</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        const initialStories = [
            { user: "Melis_K", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150", url: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500" },
            { user: "Berk_Can", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150", url: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500" },
            { user: "Ayşe_N", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150", url: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500" },
            { user: "Deniz_A", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150", url: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=500" },
            { user: "Ceren_S", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150", url: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500" }
        ];

        const defaultPosts = [
            {
                id: 101,
                user: "Ali_Yılmaz",
                handle: "AliYilmaz",
                time: "2dk önce",
                avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150",
                caption: "Bugün harika bir yürüyüş yaptım! Manzara muhteşemdi. 🏔️⭐ <span class='text-blue-400'>#doga #gezi</span>",
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                isVideo: true,
                likes: 12,
                liked: false
            },
            {
                id: 102,
                user: "Zeynep_Ç",
                handle: "Zeynep_C",
                time: "15dk önce",
                avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150",
                caption: "Yeni kahve dükkanımızı açtık! Hepinizi bekleriz.☕ <span class='text-blue-400'>#nenmara #doga #gezi</span>",
                url: "https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=600",
                isVideo: false,
                likes: 34,
                liked: false
            }
        ];

        let state = {
            currentUser: null,
            stories: [...initialStories],
            posts: []
        };

        window.onload = function() {
            loadSavedDatabase();
            if (!state.currentUser) {
                document.getElementById('signup-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            } else {
                document.getElementById('signup-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initMainApp();
            }
        };

        function loadSavedDatabase() {
            const savedUser = localStorage.getItem('xsocial_active_user');
            if (savedUser) { try { state.currentUser = JSON.parse(savedUser); } catch(e){} }

            const savedPosts = localStorage.getItem('xsocial_posts_data');
            if (savedPosts) { 
                try { state.posts = JSON.parse(savedPosts); } catch(e){ state.posts = defaultPosts; }
            } else {
                state.posts = defaultPosts;
            }
        }

        function directRegisterOrLogin() {
            const fullname = document.getElementById('signup-fullname').value.trim();
            const email = document.getElementById('signup-email').value.trim();

            if (!email) { alert("Lütfen e-posta giriniz!"); return; }

            const user = {
                username: fullname ? fullname.replace(/\s+/g, '_') : email.split('@')[0],
                handle: email.split('@')[0],
                name: fullname || email.split('@')[0],
                email: email,
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
            };

            state.currentUser = user;
            localStorage.setItem('xsocial_active_user', JSON.stringify(user));
            document.getElementById('signup-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            initMainApp();
        }

        function initMainApp() {
            if (state.currentUser) {
                document.getElementById('my-story-avatar').src = state.currentUser.avatar;
            }
            renderStories();
            renderPosts();
        }

        function renderStories() {
            const container = document.getElementById('stories-container');
            container.innerHTML = state.stories.map(s => `
                <div onclick="openStoryView('${s.user}', '${s.avatar}', '${s.url}', ${s.isVideo || false})" class="flex flex-col items-center gap-1 shrink-0 cursor-pointer">
                    <div class="story-ring w-14 h-14 rounded-full flex items-center justify-center">
                        <img src="${s.avatar}" class="w-full h-full object-cover rounded-full border-2 border-[#0d0e12]">
                    </div>
                    <span class="text-[10px] text-zinc-300 truncate w-14 text-center">${s.user}</span>
                </div>
            `).join('');
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = state.posts.map(p => `
                <article class="bg-[#16181f] border border-[#262933] rounded-2xl overflow-hidden shadow-sm">
                    <!-- Header -->
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-2.5">
                            <img src="${p.avatar}" class="w-8 h-8 rounded-full object-cover">
                            <div>
                                <h4 class="font-bold text-xs text-white">${p.user}</h4>
                                <p class="text-[10px] text-zinc-400">@${p.handle || p.user} ${p.time ? '· ' + p.time : ''}</p>
                            </div>
                        </div>
                        <i class="fas fa-ellipsis-h text-zinc-500 text-xs"></i>
                    </div>

                    <!-- Media -->
                    ${p.url ? `
                        <div class="relative bg-black max-h-[400px] overflow-hidden flex items-center justify-center">
                            ${p.isVideo ? 
                                `<video src="${p.url}" controls playsinline preload="metadata" class="w-full max-h-[400px] object-cover"></video>` : 
                                `<img src="${p.url}" class="w-full max-h-[400px] object-cover">`
                            }
                        </div>
                    ` : ''}

                    <!-- Text & Actions -->
                    <div class="p-3 space-y-2.5">
                        <p class="text-xs text-zinc-200 leading-relaxed">${p.caption}</p>

                        <!-- Action Bar -->
                        <div class="flex items-center justify-between text-zinc-400 pt-1 text-xs border-t border-[#262933]/60">
                            <button class="flex items-center gap-1 hover:text-white">
                                <i class="far fa-comment"></i>
                                <span class="text-[10px]">Yorum Yap</span>
                            </button>
                            <button class="flex items-center gap-1 hover:text-white">
                                <i class="fas fa-retweet"></i>
                                <span class="text-[10px]">Tekrar Paylaş</span>
                            </button>
                            <button onclick="toggleLike(${p.id})" class="flex items-center gap-1 ${p.liked ? 'text-red-500' : 'hover:text-white'}">
                                <i class="${p.liked ? 'fas' : 'far'} fa-heart"></i>
                                <span class="text-[10px]">Beğen</span>
                            </button>
                            <button class="flex items-center gap-1 hover:text-white">
                                <i class="far fa-bookmark"></i>
                                <span class="text-[10px]">Kaydet</span>
                            </button>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function toggleLike(postId) {
            const post = state.posts.find(p => p.id === postId);
            if(post) {
                post.liked = !post.liked;
                savePostsState();
                renderPosts();
            }
        }

        function savePostsState() {
            try { localStorage.setItem('xsocial_posts_data', JSON.stringify(state.posts)); } catch(e){}
        }

        function submitNewPost() {
            const fileInput = document.getElementById('post-file-input');
            const caption = document.getElementById('post-caption-input').value.trim();
            if (!caption && (!fileInput.files || !fileInput.files[0])) return alert("İçerik yazın veya medya seçin!");

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    addPostToState(e.target.result, fileInput.files[0].type.startsWith('video'), caption);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                addPostToState(null, false, caption);
            }
        }

        function addPostToState(mediaUrl, isVideo, caption) {
            state.posts.unshift({
                id: Date.now(),
                user: state.currentUser.name,
                handle: state.currentUser.handle,
                time: "Şimdi",
                avatar: state.currentUser.avatar,
                url: mediaUrl,
                isVideo: isVideo,
                caption: caption || "",
                likes: 0,
                liked: false
            });
            savePostsState();
            closeModal('create-post-modal');
            document.getElementById('post-caption-input').value = '';
            document.getElementById('post-file-input').value = '';
            renderPosts();
        }

        function submitNewStory() {
            const fileInput = document.getElementById('story-file-input');
            if (!fileInput.files || !fileInput.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                state.stories.unshift({ user: state.currentUser.username, avatar: state.currentUser.avatar, url: e.target.result, isVideo: fileInput.files[0].type.startsWith('video') });
                closeModal('create-story-modal');
                renderStories();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function openStoryView(user, avatar, url, isVideo) {
            document.getElementById('story-user-name').innerText = user;
            document.getElementById('story-user-avatar').src = avatar;
            document.getElementById('story-media-container').innerHTML = isVideo ? `<video src="${url}" autoplay controls class="max-h-[70vh] rounded-xl"></video>` : `<img src="${url}" class="max-h-[70vh] rounded-xl object-contain">`;
            openModal('view-story-modal');
        }

        function closeStoryView() { 
            document.getElementById('story-media-container').innerHTML = '';
            closeModal('view-story-modal'); 
        }

        function logoutAccount() {
            localStorage.removeItem('xsocial_active_user');
            location.reload();
        }

        function clearAllData() {
            if (confirm("Tüm veri ve önbellek temizlensin mi?")) { localStorage.clear(); location.reload(); }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
