<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI - Social Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        omni: {
                            black: '#000000',
                            card: '#0a0a0a',
                            border: 'rgba(16, 185, 129, 0.25)',
                            green: '#10b981',
                            neon: '#00ff87'
                        }
                    },
                    boxShadow: {
                        'neon': '0 0 15px rgba(0, 255, 135, 0.3)',
                        'neon-lg': '0 0 25px rgba(16, 185, 129, 0.5)'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #000000;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .story-ring {
            background: linear-gradient(45deg, #10b981, #00ff87, #047857);
            padding: 2px;
        }
        .glass-header {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-black text-white h-full min-h-screen pb-20">

    <!-- SIGNUP / LOGIN SCREEN -->
    <div id="signup-screen" class="hidden fixed inset-0 z-50 bg-black flex items-center justify-center p-4 max-w-md mx-auto">
        <div class="w-full bg-zinc-950 border border-emerald-500/40 rounded-3xl p-6 space-y-5 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800/80 pb-3">
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-green-300 tracking-wider">OMNI</h1>
            </div>

            <div class="text-center space-y-1">
                <p class="text-xs text-zinc-400">Tek tıkla kayıt ol veya var olan hesabınla giriş yap</p>
            </div>

            <div class="space-y-3.5">
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">İsim Soyisim</label>
                    <input type="text" id="signup-fullname" placeholder="Örn: Ahmet Yılmaz" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">Gmail / E-posta Adresi (Benzersiz)</label>
                    <input type="email" id="signup-email" placeholder="ornek@gmail.com" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="pt-1 space-y-2">
                    <button onclick="directRegisterOrLogin()" class="w-full bg-gradient-to-r from-emerald-400 to-green-500 text-black font-extrabold py-3 rounded-xl text-xs hover:opacity-95 transition shadow-neon flex items-center justify-center gap-2">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Hesap Aç / Giriş Yap</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="hidden">
        <!-- TOP HEADER -->
        <header id="main-header" class="sticky top-0 z-40 glass-header border-b border-zinc-900 px-4 py-3 flex items-center justify-between max-w-md mx-auto">
            <div class="flex items-center gap-2">
                <span class="font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-emerald-300 to-green-400">OMNI</span>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openModal('create-post-modal')" class="text-lg text-emerald-400 hover:text-emerald-300 transition" title="Yeni Gönderi">
                    <i class="fas fa-plus-circle"></i>
                </button>
            </div>
        </header>

        <!-- APP CONTAINER -->
        <div class="max-w-md mx-auto min-h-[calc(100vh-110px)] relative">

            <!-- MAIN FEED (TWITTER / INSTAGRAM HYBRID) -->
            <section id="tab-feed" class="tab-content">
                <!-- INSTAGRAM STYLE STORIES BAR -->
                <div class="py-3 px-2 border-b border-zinc-900 overflow-x-auto hide-scrollbar flex gap-4 items-center bg-black">
                    <!-- Add Story -->
                    <div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="openModal('create-story-modal')">
                        <div class="relative w-16 h-16 rounded-full p-0.5 border-2 border-dashed border-emerald-500/60 flex items-center justify-center">
                            <img id="my-story-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-full h-full object-cover rounded-full">
                            <div class="absolute bottom-0 right-0 bg-emerald-500 text-black w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold border-2 border-black">
                                <i class="fas fa-plus text-[10px]"></i>
                            </div>
                        </div>
                        <span class="text-[11px] text-zinc-400 truncate w-16 text-center">Hikayen</span>
                    </div>

                    <!-- Story Items -->
                    <div id="stories-container" class="flex gap-4">
                        <!-- Dynamic Stories -->
                    </div>
                </div>

                <!-- TWITTER STYLE FEED POSTS -->
                <div id="posts-container" class="divide-y divide-zinc-900">
                    <!-- Dynamic Posts -->
                </div>
            </section>

        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="fixed bottom-0 left-0 right-0 z-40 bg-black/95 backdrop-blur-md border-t border-zinc-900 max-w-md mx-auto px-8 py-3 flex justify-around items-center">
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="text-emerald-400 text-xl transition">
                <i class="fas fa-home"></i>
            </button>
            
            <button onclick="openModal('create-post-modal')" class="w-11 h-11 rounded-full bg-gradient-to-r from-emerald-400 to-green-500 text-black flex items-center justify-center font-bold text-lg shadow-neon transform active:scale-95 transition">
                <i class="fas fa-plus"></i>
            </button>

            <button onclick="openModal('settings-modal')" class="text-zinc-400 hover:text-emerald-400 text-xl transition">
                <i class="fas fa-cog"></i>
            </button>
        </nav>
    </div>

    <!-- MODALS -->

    <!-- CREATE POST MODAL -->
    <div id="create-post-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/30 w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400">Yeni Gönderi Paylaş</h3>
                <button onclick="closeModal('create-post-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-zinc-400 mb-1 block">Fotoğraf veya Video Seç</label>
                    <input type="file" id="post-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/20 file:text-emerald-400 cursor-pointer">
                </div>
                <textarea id="post-caption-input" rows="3" placeholder="Neler oluyor?..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
            </div>
            <button onclick="submitNewPost()" class="w-full bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs shadow-neon flex items-center justify-center gap-2">
                <span>Paylaş</span>
            </button>
        </div>
    </div>

    <!-- CREATE STORY MODAL -->
    <div id="create-story-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/30 w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400">Hikaye Ekle</h3>
                <button onclick="closeModal('create-story-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div>
                <label class="text-[10px] text-zinc-400 mb-1 block">Fotoğraf / Video Seç</label>
                <input type="file" id="story-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/20 file:text-emerald-400 cursor-pointer">
            </div>
            <button onclick="submitNewStory()" class="w-full bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs shadow-neon">
                <span>Hikayelere Ekle</span>
            </button>
        </div>
    </div>

    <!-- VIEW STORY MODAL -->
    <div id="view-story-modal" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between p-4 max-w-md mx-auto">
        <div class="flex items-center justify-between py-2 border-b border-zinc-800">
            <div class="flex items-center gap-2">
                <img id="story-user-avatar" src="" class="w-8 h-8 rounded-full border border-emerald-400 object-cover">
                <span id="story-user-name" class="font-bold text-xs text-white"></span>
            </div>
            <button onclick="closeStoryView()" class="text-white text-base"><i class="fas fa-times"></i></button>
        </div>
        <div id="story-media-container" class="flex-1 flex items-center justify-center my-2 overflow-hidden"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/30 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400"><i class="fas fa-cog mr-1"></i> Ayarlar</h3>
                <button onclick="closeModal('settings-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>

            <div class="space-y-3 text-xs">
                <button onclick="clearAllData()" class="w-full text-left p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-amber-400 hover:border-amber-500/40 transition">
                    <i class="fas fa-eraser mr-1"></i> Önbelleği Temizle
                </button>
            </div>

            <div class="border-t border-zinc-800 pt-3 space-y-2">
                <button onclick="logoutAccount()" class="w-full bg-zinc-900 border border-zinc-800 text-emerald-400 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Çıkış Yap</span>
                </button>
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        let state = {
            currentUser: null,
            stories: [
                { id: 1, user: "can_tech", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150", url: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=500", isVideo: false },
                { id: 2, user: "ebru.art", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150", url: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500", isVideo: false }
            ],
            posts: []
        };

        window.onload = function() {
            loadSavedDatabase();
            if (!state.currentUser) {
                document.getElementById('signup-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            } else {
                document.getElementById('signup-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initMainApp();
            }
        };

        function loadSavedDatabase() {
            const savedUser = localStorage.getItem('omni_active_user');
            if (savedUser) { try { state.currentUser = JSON.parse(savedUser); } catch(e){} }

            const savedPosts = localStorage.getItem('omni_posts_data');
            if (savedPosts) { try { state.posts = JSON.parse(savedPosts); } catch(e){} }
        }

        function directRegisterOrLogin() {
            const fullname = document.getElementById('signup-fullname').value.trim();
            const email = document.getElementById('signup-email').value.trim().toLowerCase();

            if (!email) { alert("Lütfen e-posta giriniz!"); return; }

            const user = {
                username: email.split('@')[0],
                name: fullname || email.split('@')[0],
                email: email,
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
            };

            state.currentUser = user;
            localStorage.setItem('omni_active_user', JSON.stringify(user));
            document.getElementById('signup-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            initMainApp();
        }

        function initMainApp() {
            renderStories();
            renderPosts();
        }

        function renderStories() {
            const container = document.getElementById('stories-container');
            container.innerHTML = state.stories.map(s => `
                <div onclick="openStoryView('${s.user}', '${s.avatar}', '${s.url}', ${s.isVideo})" class="flex flex-col items-center gap-1 shrink-0 cursor-pointer">
                    <div class="story-ring w-16 h-16 rounded-full flex items-center justify-center">
                        <img src="${s.avatar}" class="w-full h-full object-cover rounded-full border-2 border-black">
                    </div>
                    <span class="text-[11px] text-zinc-300 truncate w-16 text-center">${s.user}</span>
                </div>
            `).join('');
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            if (state.posts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 px-4 space-y-3">
                        <div class="w-16 h-16 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center mx-auto text-xl">
                            <i class="fas fa-stream"></i>
                        </div>
                        <h3 class="font-bold text-sm text-zinc-200">Henüz Gönderi Yok</h3>
                        <p class="text-xs text-zinc-500 max-w-xs mx-auto">Aşağıdaki (+) butonuna basarak ilk gönderini paylaşabilirsin.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = state.posts.map(p => `
                <article class="p-4 bg-black hover:bg-zinc-950/50 transition border-b border-zinc-900">
                    <div class="flex items-start gap-3">
                        <img src="${p.avatar}" class="w-10 h-10 rounded-full object-cover border border-zinc-800">
                        <div class="flex-1 space-y-2">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-1.5">
                                    <span class="font-bold text-xs text-white">${p.user}</span>
                                    <span class="text-[10px] text-zinc-500">@${p.user}</span>
                                </div>
                            </div>

                            <p class="text-xs text-zinc-200 leading-relaxed">${p.caption}</p>

                            ${p.url ? `
                                <div class="rounded-2xl overflow-hidden border border-zinc-800/80 bg-zinc-950 mt-2">
                                    ${p.isVideo ? 
                                        `<video src="${p.url}" controls playsinline preload="metadata" class="w-full max-h-[380px] object-cover"></video>` : 
                                        `<img src="${p.url}" class="w-full max-h-[380px] object-cover">`
                                    }
                                </div>
                            ` : ''}

                            <div class="flex justify-between items-center text-zinc-500 pt-2 text-xs max-w-xs">
                                <button onclick="toggleLike(${p.id})" class="flex items-center gap-1.5 ${p.liked ? 'text-emerald-400' : 'hover:text-emerald-400'}">
                                    <i class="${p.liked ? 'fas' : 'far'} fa-heart"></i>
                                    <span class="text-[11px]">${p.likes || 0}</span>
                                </button>
                                <button class="hover:text-emerald-400">
                                    <i class="far fa-comment"></i>
                                </button>
                                <button class="hover:text-emerald-400">
                                    <i class="far fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function toggleLike(postId) {
            const post = state.posts.find(p => p.id === postId);
            if(post) {
                post.liked = !post.liked;
                post.likes = (post.likes || 0) + (post.liked ? 1 : -1);
                savePostsState();
                renderPosts();
            }
        }

        function savePostsState() {
            try { localStorage.setItem('omni_posts_data', JSON.stringify(state.posts)); } catch(e){}
        }

        function submitNewPost() {
            const fileInput = document.getElementById('post-file-input');
            const caption = document.getElementById('post-caption-input').value.trim();
            if (!caption && (!fileInput.files || !fileInput.files[0])) return alert("Lütfen yazı yazın veya medya seçin!");

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    addPostToState(e.target.result, fileInput.files[0].type.startsWith('video'), caption);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                addPostToState(null, false, caption);
            }
        }

        function addPostToState(mediaUrl, isVideo, caption) {
            state.posts.unshift({
                id: Date.now(),
                user: state.currentUser.username,
                avatar: state.currentUser.avatar,
                url: mediaUrl,
                isVideo: isVideo,
                caption: caption || "",
                likes: 0,
                liked: false
            });
            savePostsState();
            closeModal('create-post-modal');
            document.getElementById('post-caption-input').value = '';
            document.getElementById('post-file-input').value = '';
            renderPosts();
        }

        function submitNewStory() {
            const fileInput = document.getElementById('story-file-input');
            if (!fileInput.files || !fileInput.files[0]) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                state.stories.unshift({ id: Date.now(), user: state.currentUser.username, avatar: state.currentUser.avatar, url: e.target.result, isVideo: fileInput.files[0].type.startsWith('video') });
                closeModal('create-story-modal');
                renderStories();
            };
            reader.readAsDataURL(fileInput.files[0]);
        }

        function openStoryView(user, avatar, url, isVideo) {
            document.getElementById('story-user-name').innerText = user;
            document.getElementById('story-user-avatar').src = avatar;
            document.getElementById('story-media-container').innerHTML = isVideo ? `<video src="${url}" autoplay controls class="max-h-[70vh] rounded-xl"></video>` : `<img src="${url}" class="max-h-[70vh] rounded-xl object-contain">`;
            openModal('view-story-modal');
        }

        function closeStoryView() { 
            document.getElementById('story-media-container').innerHTML = '';
            closeModal('view-story-modal'); 
        }

        function logoutAccount() {
            localStorage.removeItem('omni_active_user');
            location.reload();
        }

        function clearAllData() {
            if (confirm("Önbellek temizlensin mi?")) { localStorage.clear(); location.reload(); }
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    </script>
</body>
</html>
