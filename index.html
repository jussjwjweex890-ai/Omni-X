<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI - Social Platform</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        omni: {
                            black: '#000000',
                            card: '#0a0a0a',
                            border: 'rgba(16, 185, 129, 0.25)',
                            green: '#10b981',
                            neon: '#00ff87'
                        }
                    },
                    boxShadow: {
                        'neon': '0 0 15px rgba(0, 255, 135, 0.3)',
                        'neon-lg': '0 0 25px rgba(16, 185, 129, 0.5)'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background-color: #000000;
            color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .story-ring {
            background: linear-gradient(45deg, #10b981, #00ff87, #047857);
            padding: 2px;
        }
        .glass-header {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-black text-white h-full min-h-screen pb-24">

    <!-- SIGNUP / LOGIN SCREEN -->
    <div id="signup-screen" class="hidden fixed inset-0 z-50 bg-black flex items-center justify-center p-4 max-w-md mx-auto">
        <div class="w-full bg-zinc-950 border border-emerald-500/40 rounded-3xl p-6 space-y-5 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-green-300 tracking-wider">OMNI</h1>
            </div>
            <div class="space-y-3.5">
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">İsim Soyisim</label>
                    <input type="text" id="signup-fullname" placeholder="Örn: Ahmet Yılmaz" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="text-[11px] text-zinc-400 font-semibold mb-1 block">E-posta Adresi</label>
                    <input type="email" id="signup-email" placeholder="ornek@gmail.com" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                </div>
                <button onclick="directRegisterOrLogin()" class="w-full bg-gradient-to-r from-emerald-400 to-green-500 text-black font-extrabold py-3 rounded-xl text-xs shadow-neon">Giriş Yap / Kayıt Ol</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="main-app" class="hidden">
        <!-- TOP HEADER -->
        <header class="sticky top-0 z-40 glass-header border-b border-zinc-900 px-4 py-3 flex items-center justify-between max-w-md mx-auto">
            <span class="font-black text-2xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-green-400">OMNI</span>
            <div class="flex items-center gap-4">
                <!-- GELEN KUTUSU (BİLDİRİMLER) -->
                <button onclick="openModal('inbox-modal')" class="relative text-xl text-zinc-300 hover:text-emerald-400 transition">
                    <i class="far fa-bell"></i>
                    <span id="inbox-badge" class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 rounded-full"></span>
                </button>
                <!-- DM MESAJLAR -->
                <button onclick="openModal('dm-modal')" class="relative text-xl text-zinc-300 hover:text-emerald-400 transition">
                    <i class="far fa-paper-plane"></i>
                </button>
                <button onclick="openModal('settings-modal')" class="text-xl text-zinc-300 hover:text-emerald-400 transition"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <!-- APP CONTAINER -->
        <div class="max-w-md mx-auto relative">
            <section id="tab-feed">
                <!-- STORIES BAR -->
                <div class="py-3 px-2 border-b border-zinc-900 overflow-x-auto hide-scrollbar flex gap-4 items-center bg-black">
                    <div class="flex flex-col items-center gap-1 shrink-0 cursor-pointer" onclick="openModal('create-story-modal')">
                        <div class="relative w-16 h-16 rounded-full p-0.5 border-2 border-dashed border-emerald-500/60 flex items-center justify-center">
                            <img id="my-story-avatar" src="" class="w-full h-full object-cover rounded-full">
                            <div class="absolute bottom-0 right-0 bg-emerald-500 text-black w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold border-2 border-black">
                                <i class="fas fa-plus text-[10px]"></i>
                            </div>
                        </div>
                        <span class="text-[11px] text-zinc-400 truncate w-16 text-center">Hikayen</span>
                    </div>
                    <div id="stories-container" class="flex gap-4"></div>
                </div>

                <!-- FEED POSTS -->
                <div id="posts-container" class="space-y-4 pt-2"></div>
            </section>
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="fixed bottom-0 left-0 right-0 z-40 bg-black/95 backdrop-blur-md border-t border-zinc-900 max-w-md mx-auto px-6 py-3 flex justify-around items-center">
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="text-emerald-400 text-xl"><i class="fas fa-home"></i></button>
            <button onclick="openModal('search-modal')" class="text-zinc-500 hover:text-emerald-400 text-xl"><i class="fas fa-search"></i></button>
            <button onclick="openModal('create-post-modal')" class="w-11 h-11 rounded-full bg-gradient-to-r from-emerald-400 to-green-500 text-black flex items-center justify-center font-bold text-lg shadow-neon"><i class="fas fa-plus"></i></button>
            <button onclick="openModal('inbox-modal')" class="text-zinc-500 hover:text-emerald-400 text-xl"><i class="far fa-bell"></i></button>
            <button onclick="openModal('dm-modal')" class="text-zinc-500 hover:text-emerald-400 text-xl"><i class="far fa-paper-plane"></i></button>
        </nav>
    </div>

    <!-- MODALS -->

    <!-- GELEN KUTUSU (BİLDİRİMLER) MODAL -->
    <div id="inbox-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/30 w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-neon-lg flex flex-col h-[70vh]">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400"><i class="far fa-bell mr-1"></i> Gelen Kutusu</h3>
                <button onclick="closeModal('inbox-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div id="inbox-list" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- Dinamik Bildirimler -->
            </div>
        </div>
    </div>

    <!-- VİDEO VE İÇERİK/KİŞİ ARAMA MODAL -->
    <div id="search-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/30 w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-neon-lg flex flex-col h-[70vh]">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400"><i class="fas fa-search mr-1"></i> Arama (Video / Kişi)</h3>
                <button onclick="closeModal('search-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <input type="text" id="video-search-input" oninput="searchVideosAndPosts(this.value)" placeholder="Video başlığı veya kişi kullanıcı adı ara..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            <div id="search-results" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <p class="text-center text-xs text-zinc-500 py-6">Aramak istediğiniz kişi veya videoyu yazın...</p>
            </div>
        </div>
    </div>

    <!-- DM (DİREKT MESAJLAŞMA) MODAL -->
    <div id="dm-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/30 w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-neon-lg flex flex-col h-[75vh]">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400"><i class="far fa-paper-plane mr-1"></i> Mesajlar (DM)</h3>
                <button onclick="closeModal('dm-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            
            <div id="chat-list" class="flex-1 overflow-y-auto space-y-2"></div>

            <div id="chat-active-view" class="hidden flex-1 flex flex-col space-y-2 border-t border-zinc-800 pt-2">
                <div class="flex justify-between items-center border-b border-zinc-800 pb-1">
                    <span id="chat-target-name" class="text-xs font-bold text-emerald-400">Sohbet</span>
                    <button onclick="closeActiveChat()" class="text-[10px] text-zinc-400">Kapat</button>
                </div>
                <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="Mesaj yaz..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                    <button onclick="sendMessage()" class="bg-emerald-500 text-black px-3 py-2 rounded-xl text-xs font-bold shadow-neon"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- YORUMLAR MODAL (EKRANIN YARISINI KAPLAYAN & YANITLAMA DESTEKLİ) -->
    <div id="comments-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end">
        <div class="bg-zinc-950 border-t border-emerald-500/40 w-full max-w-md mx-auto rounded-t-3xl p-4 space-y-3 shadow-neon-lg flex flex-col h-[50vh]">
            <div class="w-12 h-1 bg-zinc-700 rounded-full mx-auto mb-1"></div>
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400"><i class="far fa-comment text-xs mr-1"></i> Yorumlar</h3>
                <button onclick="closeModal('comments-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div id="comments-list" class="flex-1 overflow-y-auto space-y-2 pr-1 my-2"></div>
            
            <!-- Yanıtlanan Kullanıcı Bildirimi -->
            <div id="replying-to-bar" class="hidden flex justify-between items-center bg-zinc-900 px-3 py-1 rounded-lg text-[11px] text-emerald-400 border border-emerald-500/30">
                <span id="replying-to-text"></span>
                <button onclick="cancelReply()" class="text-zinc-400 hover:text-white"><i class="fas fa-times"></i></button>
            </div>

            <div class="flex gap-2 pt-1 border-t border-zinc-800">
                <input type="text" id="comment-input" placeholder="Yorum ekle..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                <button onclick="addCommentToPost()" class="bg-emerald-500 text-black px-4 py-2 rounded-xl text-xs font-bold shadow-neon">Gönder</button>
            </div>
        </div>
    </div>

    <!-- CREATE POST MODAL -->
    <div id="create-post-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/30 w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400">Yeni Gönderi</h3>
                <button onclick="closeModal('create-post-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-3">
                <input type="file" id="post-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/20 file:text-emerald-400 cursor-pointer">
                <textarea id="post-caption-input" rows="3" placeholder="Açıklama yaz..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"></textarea>
                
                <div id="post-media-preview" class="hidden relative rounded-xl overflow-hidden max-h-40 bg-black flex items-center justify-center"></div>

                <div>
                    <button onclick="toggleGifSearch()" class="w-full bg-zinc-900 border border-zinc-800 text-emerald-400 py-2 rounded-xl text-xs font-bold hover:bg-zinc-800 transition flex items-center justify-center gap-1.5">
                        <i class="fas fa-gift"></i> GIF Arayıp Ekle (Tenor)
                    </button>
                </div>
            </div>
            <button onclick="submitNewPost()" class="w-full bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs shadow-neon">Paylaş</button>
        </div>
    </div>

    <!-- GIF PICKER MODAL -->
    <div id="gif-picker-modal" class="hidden fixed inset-0 z-[60] bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/40 w-full max-w-sm rounded-2xl p-4 space-y-3 shadow-neon-lg flex flex-col max-h-[70vh]">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400">GIF Arama</h3>
                <button onclick="closeModal('gif-picker-modal')" class="text-zinc-400"><i class="fas fa-times"></i></button>
            </div>
            <input type="text" id="gif-search-box" placeholder="GIF ara (örn: happy, cat)..." oninput="searchGifs(this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            <div id="gif-results-grid" class="grid grid-cols-2 gap-2 overflow-y-auto max-h-64 pr-1">
                <p class="col-span-2 text-center text-xs text-zinc-500 py-6">Arama yapmak için kelime yazın...</p>
            </div>
        </div>
    </div>

    <!-- CREATE STORY MODAL -->
    <div id="create-story-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/30 w-full max-w-sm rounded-2xl p-4 space-y-4 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400">Hikaye Ekle</h3>
                <button onclick="closeModal('create-story-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <input type="file" id="story-file-input" accept="image/*,video/*" class="w-full text-xs text-zinc-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/20 file:text-emerald-400 cursor-pointer">
            <button onclick="submitNewStory()" class="w-full bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs shadow-neon">Hikayelere Ekle</button>
        </div>
    </div>

    <!-- VIEW STORY MODAL -->
    <div id="view-story-modal" class="hidden fixed inset-0 z-50 bg-black flex flex-col justify-between p-4 max-w-md mx-auto">
        <div class="flex items-center justify-between py-2 border-b border-zinc-800">
            <div class="flex items-center gap-2">
                <img id="story-user-avatar" src="" class="w-8 h-8 rounded-full border border-emerald-400 object-cover">
                <span id="story-user-name" class="font-bold text-xs text-white"></span>
            </div>
            <button onclick="closeStoryView()" class="text-white text-base"><i class="fas fa-times"></i></button>
        </div>
        <div id="story-media-container" class="flex-1 flex items-center justify-center my-2 overflow-hidden"></div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-zinc-950 border border-emerald-500/30 w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-neon-lg">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="font-bold text-sm text-emerald-400"><i class="fas fa-cog mr-1"></i> Ayarlar</h3>
                <button onclick="closeModal('settings-modal')" class="text-zinc-500 text-sm"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-2 text-xs">
                <button onclick="clearAllData()" class="w-full text-left p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-amber-400">Önbelleği Temizle</button>
                <button onclick="logoutAccount()" class="w-full text-left p-2.5 rounded-xl bg-zinc-900 border border-zinc-800 text-emerald-400">Çıkış Yap</button>
            </div>
        </div>
    </div>

    <!-- APPLICATION LOGIC -->
    <script>
        let state = {
            currentUser: null,
            followingUsers: [],
            notifications: [
                { id: 1, type: "follow", user: "ebru.art", text: "seni takip etmeye başladı.", time: "10dk önce" },
                { id: 2, type: "like", user: "can_tech", text: "gönderini beğendi.", time: "1sa önce" },
                { id: 3, type: "reply", user: "ebru.art", text: "yorumuna yanıt verdi: 'Aynen katılıyorum!'", time: "2sa önce" }
            ],
            stories: [
                { id: 1, user: "can_tech", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150", url: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=500", isVideo: false },
                { id: 2, user: "ebru.art", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150", url: "https://images.unsplash.com/photo-1579783902614-a3fb3927b675?w=500", isVideo: false }
            ],
            posts: [
                {
                    id: 101,
                    user: "Can_Tech",
                    avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150",
                    url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                    isVideo: true,
                    caption: "OMNI ortamında harika bir doğa videosu! 🏔️✨",
                    likes: 18,
                    liked: false,
                    comments: [{ id: 1, user: "ebru.art", text: "Çok iyi!", replies: [{ user: "Can_Tech", text: "Teşekkürler!" }] }]
                }
            ],
            chats: {
                "can_tech": [
                    { sender: "can_tech", text: "Selam! OMNI'ye hoş geldin." }
                ]
            },
            activeChatUser: null,
            activeCommentPostId: null,
            replyingToCommentUser: null,
            selectedMediaUrl: null
        };

        window.onload = function() {
            loadSavedDatabase();
            if (!state.currentUser) {
                document.getElementById('signup-screen').classList.remove('hidden');
                document.getElementById('main-app').classList.add('hidden');
            } else {
                document.getElementById('signup-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                initMainApp();
            }
        };

        function loadSavedDatabase() {
            const savedUser = localStorage.getItem('omni_active_user');
            if (savedUser) { try { state.currentUser = JSON.parse(savedUser); } catch(e){} }
            const savedPosts = localStorage.getItem('omni_posts_data');
            if (savedPosts) { try { state.posts = JSON.parse(savedPosts); } catch(e){} }
            const savedFollowing = localStorage.getItem('omni_following_users');
            if (savedFollowing) { try { state.followingUsers = JSON.parse(savedFollowing); } catch(e){} }
        }

        function directRegisterOrLogin() {
            const fullname = document.getElementById('signup-fullname').value.trim();
            const email = document.getElementById('signup-email').value.trim().toLowerCase();
            if (!email) { alert("Lütfen e-posta giriniz!"); return; }

            state.currentUser = {
                username: email.split('@')[0],
                name: fullname || email.split('@')[0],
                email: email,
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150"
            };
            localStorage.setItem('omni_active_user', JSON.stringify(state.currentUser));
            document.getElementById('signup-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            initMainApp();
        }

        function initMainApp() {
            if (state.currentUser) {
                document.getElementById('my-story-avatar').src = state.currentUser.avatar;
            }
            renderStories();
            renderPosts();
            renderChatList();
            renderInbox();
        }

        function renderInbox() {
            const list = document.getElementById('inbox-list');
            list.innerHTML = state.notifications.map(n => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-zinc-900 border border-zinc-800">
                    <div class="flex items-center gap-2.5">
                        <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">
                            ${n.type === 'follow' ? '<i class="fas fa-user-plus"></i>' : n.type === 'like' ? '<i class="fas fa-heart"></i>' : '<i class="fas fa-reply"></i>'}
                        </div>
                        <div>
                            <p class="text-xs text-white"><span class="font-bold text-emerald-400">${n.user}</span> ${n.text}</p>
                            <span class="text-[10px] text-zinc-500">${n.time}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderStories() {
            const container = document.getElementById('stories-container');
            container.innerHTML = state.stories.map(s => `
                <div onclick="openStoryView('${s.user}', '${s.avatar}', '${s.url}', ${s.isVideo})" class="flex flex-col items-center gap-1 shrink-0 cursor-pointer">
                    <div class="story-ring w-16 h-16 rounded-full flex items-center justify-center">
                        <img src="${s.avatar}" class="w-full h-full object-cover rounded-full border-2 border-black">
                    </div>
                    <span class="text-[11px] text-zinc-300 truncate w-16 text-center">${s.user}</span>
                </div>
            `).join('');
        }

        function renderPosts() {
            const container = document.getElementById('posts-container');
            container.innerHTML = state.posts.map(p => {
                const isFollowing = state.followingUsers.includes(p.user);
                return `
                <article class="post-item bg-black border-b border-zinc-900 pb-4">
                    <div class="flex items-center justify-between p-3">
                        <div class="flex items-center gap-2.5">
                            <div class="story-ring w-9 h-9 rounded-full flex items-center justify-center">
                                <img src="${p.avatar}" class="w-full h-full object-cover rounded-full border border-black">
                            </div>
                            <span class="font-bold text-xs text-white">${p.user}</span>
                        </div>
                        ${p.user !== state.currentUser?.username ? `
                            <button onclick="toggleFollow('${p.user}')" class="text-xs px-3 py-1 rounded-full font-bold transition ${isFollowing ? 'bg-zinc-800 text-zinc-300' : 'bg-emerald-500 text-black shadow-neon'}">
                                ${isFollowing ? 'Takiptesin' : 'Takip Et'}
                            </button>
                        ` : ''}
                    </div>

                    <div class="relative overflow-hidden bg-zinc-950 flex items-center justify-center max-h-[450px]">
                        ${p.isVideo ? 
                            `<video src="${p.url}" muted playsinline preload="auto" class="w-full max-h-[450px] object-cover"></video>` : 
                            `<img src="${p.url}" class="w-full max-h-[450px] object-cover">`
                        }
                    </div>

                    <div class="p-3 space-y-2">
                        <div class="flex justify-between items-center text-lg">
                            <div class="flex gap-4">
                                <button onclick="toggleLike(${p.id})" class="${p.liked ? 'text-emerald-400' : 'text-zinc-300'} transition">
                                    <i class="${p.liked ? 'fas' : 'far'} fa-heart"></i>
                                </button>
                                <button onclick="openCommentsModal(${p.id})" class="text-zinc-300 hover:text-emerald-400">
                                    <i class="far fa-comment"></i>
                                </button>
                                <button onclick="openChatWith('${p.user}')" class="text-zinc-300 hover:text-emerald-400">
                                    <i class="far fa-paper-plane"></i>
                                </button>
                            </div>
                        </div>
                        <p class="font-bold text-xs text-emerald-400">${p.likes || 0} beğenme</p>
                        <p class="text-xs text-zinc-200"><span class="font-bold mr-1 text-white">${p.user}</span>${p.caption}</p>
                    </div>
                </article>
            `}).join('');

            setupVideoIntersectionObserver();
        }

        // TAKİP SİSTEMİ
        function toggleFollow(username) {
            if (state.followingUsers.includes(username)) {
                state.followingUsers = state.followingUsers.filter(u => u !== username);
            } else {
                state.followingUsers.push(username);
                // Bildirim ekle
                state.notifications.unshift({ id: Date.now(), type: "follow", user: state.currentUser.username, text: "seni takip etmeye başladı.", time: "Şimdi" });
            }
            localStorage.setItem('omni_following_users', JSON.stringify(state.followingUsers));
            renderPosts();
            renderInbox();
        }

        // VİDEO VE İÇERİK/KİŞİ ARAMA HİZMETİ
        function searchVideosAndPosts(query) {
            const resultsContainer = document.getElementById('search-results');
            if (!query.trim()) {
                resultsContainer.innerHTML = `<p class="text-center text-xs text-zinc-500 py-6">Aramak istediğiniz kişi veya videoyu yazın...</p>`;
                return;
            }

            const filtered = state.posts.filter(p => p.caption.toLowerCase().includes(query.toLowerCase()) || p.user.toLowerCase().includes(query.toLowerCase()));

            if (filtered.length === 0) {
                resultsContainer.innerHTML = `<p class="text-center text-xs text-zinc-500 py-6">Sonuç bulunamadı.</p>`;
                return;
            }

            resultsContainer.innerHTML = filtered.map(p => `
                <div class="flex items-center gap-3 p-2 rounded-xl bg-zinc-900 border border-zinc-800">
                    <div class="w-12 h-12 rounded-lg bg-black overflow-hidden shrink-0 flex items-center justify-center">
                        ${p.isVideo ? `<video src="${p.url}" class="w-full h-full object-cover"></video>` : `<img src="${p.url}" class="w-full h-full object-cover">`}
                    </div>
                    <div class="flex-1 truncate">
                        <p class="font-bold text-xs text-white">${p.user}</p>
                        <p class="text-[10px] text-zinc-400 truncate">${p.caption}</p>
                    </div>
                </div>
            `).join('');
        }

        // DM SİSTEMİ
        function renderChatList() {
            const list = document.getElementById('chat-list');
            const users = Object.keys(state.chats);
            list.innerHTML = users.map(u => `
                <div onclick="openChatWith('${u}')" class="flex items-center justify-between p-3 rounded-xl bg-zinc-900 border border-zinc-800 cursor-pointer hover:border-emerald-500/50">
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-xs">
                            ${u[0].toUpperCase()}
                        </div>
                        <span class="text-xs font-bold text-white">${u}</span>
                    </div>
                    <i class="fas fa-chevron-right text-xs text-zinc-600"></i>
                </div>
            `).join('');
        }

        function openChatWith(username) {
            state.activeChatUser = username;
            if (!state.chats[username]) state.chats[username] = [];
            document.getElementById('chat-target-name').innerText = `@${username}`;
            document.getElementById('chat-list').classList.add('hidden');
            document.getElementById('chat-active-view').classList.remove('hidden');
            openModal('dm-modal');
            renderMessages();
        }

        function closeActiveChat() {
            state.activeChatUser = null;
            document.getElementById('chat-active-view').classList.add('hidden');
            document.getElementById('chat-list').classList.remove('hidden');
        }

        function renderMessages() {
            const container = document.getElementById('chat-messages');
            const msgs = state.chats[state.activeChatUser] || [];
            container.innerHTML = msgs.map(m => `
                <div class="flex flex-col ${m.sender === state.currentUser.username ? 'items-end' : 'items-start'}">
                    <div class="max-w-[80%] p-2.5 rounded-xl text-xs ${m.sender === state.currentUser.username ? 'bg-emerald-500 text-black font-semibold' : 'bg-zinc-900 text-white border border-zinc-800'}">
                        ${m.text}
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !state.activeChatUser) return;

            state.chats[state.activeChatUser].push({
                sender: state.currentUser.username,
                text: text
            });
            input.value = '';
            renderMessages();
        }

        // YORUMLARA YANIT VERME SİSTEMİ
        function openCommentsModal(postId) {
            state.activeCommentPostId = postId;
            renderComments();
            openModal('comments-modal');
        }

        function renderComments() {
            const post = state.posts.find(p => p.id === state.activeCommentPostId);
            const list = document.getElementById('comments-list');
            if (!post || !post.comments || post.comments.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-zinc-500 py-6">Henüz yorum yapılmamış.</p>`;
                return;
            }
            list.innerHTML = post.comments.map((c, idx) => `
                <div class="bg-zinc-900 p-2.5 rounded-xl text-xs border border-zinc-800 space-y-1.5">
                    <div class="flex justify-between items-center">
                        <span class="font-bold text-emerald-400">${c.user}</span>
                        <button onclick="startReplyTo('${c.user}')" class="text-[10px] text-zinc-400 hover:text-emerald-400 flex items-center gap-1">
                            <i class="fas fa-reply"></i> Yanıtla
                        </button>
                    </div>
                    <p class="text-zinc-200">${c.text}</p>
                    
                    ${c.replies && c.replies.length > 0 ? `
                        <div class="pl-3 border-l-2 border-emerald-500/40 space-y-1 mt-1">
                            ${c.replies.map(r => `
                                <div class="text-[11px]">
                                    <span class="font-bold text-emerald-300">${r.user}:</span>
                                    <span class="text-zinc-300">${r.text}</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        function startReplyTo(user) {
            state.replyingToCommentUser = user;
            document.getElementById('replying-to-text').innerText = `@${user} kullanıcısına yanıt veriyorsun`;
            document.getElementById('replying-to-bar').classList.remove('hidden');
            document.getElementById('comment-input').focus();
        }

        function cancelReply() {
            state.replyingToCommentUser = null;
            document.getElementById('replying-to-bar').classList.add('hidden');
        }
